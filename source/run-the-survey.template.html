<title>Spot Volunteer and Non-Response Bias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap">
<style>
/* Layout: C4R monolith activity shell. Sticky header, fixed footer, one lg (1024) column, light theme only (the activity format is light). */
:root{
  --text:#202020; --muted:#757575; --rule:#E0E0E0; --card-border:rgba(0,0,0,.15); --page:#ffffff; --panel:#F7F7F8;
  --purple:#6F00FF; --purple-tint:#f3e8ff; --purple-hover:#F3EBFF;
  --green:#0AA000; --green-text:#2e7d32; --green-tint:#e8f5e9;
  --red:#d00000; --red-tint:#ffebeb;
  --amber:#ff9800; --amber-text:#A16000; --amber-tint:#fff3e0;
  --info:#0082FF; --info-tint:#e0f2fe;
  --takeaway:#1859D7; --takeaway-tint:#e3ebfa;
  --grey-tone:#e7e6e6; --grey-tone-border:#333132;
  --mid-gray:#999999; --option-border:#7F7F7F;
  --unit:#0082FF; --unit-tint:#e0f0ff; --instr-tint:#eee0ff;
  --font:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --fs-xs:.75rem; --fs-sm:.875rem; --fs-md:1rem; --fs-lg:1.2rem; --fs-xl:1.4rem;
  --h1:1.5rem; --h2:1.375rem; --h3:1.25rem; --h4:1.125rem;
  --header-h:52px; --footer-h:81px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:var(--fs-md);line-height:1.5;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:var(--h1);font-weight:800}
h2{font-size:var(--h2);font-weight:700}
h3{font-size:var(--h3);font-weight:700}
h4{font-size:var(--h4);font-weight:700}
p{margin:0}
ul,ol{margin:0;padding-left:1.4em}
button{font-family:inherit;font-size:var(--fs-md);cursor:pointer}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
/* The hidden attribute always wins, even over an element's own display rule, so the page behaves the same on GitHub Pages as inside the artifact host. */
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:var(--purple)}

/* Chrome */
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--header-h);background:var(--page);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--page)}
.header .logo{width:32px;height:32px;flex:none}
.header h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header .proto{font-size:var(--fs-xs);color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:2px 10px;white-space:nowrap}
.footer{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--footer-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--page);border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.footer[hidden]{display:none}
.footer .inner{width:100%;max-width:1024px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.gate-msg{position:absolute;right:0;bottom:calc(100% + 6px);background:var(--text);color:#fff;font-size:var(--fs-sm);padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.gate-msg.show{opacity:1}
@media (max-width:640px){.gate-msg{white-space:normal;max-width:70vw;text-align:right}}

/* Buttons (StyledButton) */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:10px 20px;font-weight:400;border:2px solid transparent;line-height:1.2;min-height:44px}
.btn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn.primary:hover{background:#5700CA;border-color:#5700CA}
.btn.secondary{background:#fff;color:var(--purple);border-color:var(--purple)}
.btn.secondary:hover{background:var(--purple-hover)}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.primary[aria-disabled="true"]:hover{background:var(--purple);border-color:var(--purple)}
.btn svg{width:20px;height:20px;flex:none}

/* Page */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(var(--footer-h) + 28px)}
main.no-footer{padding-bottom:40px}
.col{max-width:1024px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.col.md{max-width:768px}
.col.congrats{max-width:600px}

/* Progress bar */
.progress{display:flex;flex-direction:column;gap:6px}
.progress .blocks{display:flex;gap:4px}
.progress .blocks span{flex:1;height:8px;border-radius:2px;background:var(--rule)}
.progress .blocks span.done{background:var(--purple)}
.progress .labels{display:flex;justify-content:space-between;font-size:var(--fs-sm);color:var(--muted);gap:12px}
.progress .labels b{font-weight:600;color:var(--text)}

/* Cards and panels */
.card{background:#fff;border:1px solid var(--card-border);border-radius:12px;padding:16px 20px}
.icard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;background:var(--instr-tint)}
.icard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--purple)}
.icard .claim{font-size:var(--fs-sm);color:var(--muted);border-top:1px solid rgba(111,0,255,.25);padding-top:8px;margin-top:4px}
.precontext h3{margin-bottom:6px}
.icard .claim b{color:var(--text);font-weight:600}
details.study{border:1px solid var(--card-border);border-radius:12px;background:#fff}
details.study summary{cursor:pointer;padding:12px 20px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.study summary::-webkit-details-marker{display:none}
details.study summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--text);border-bottom:2px solid var(--text);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.study[open] summary::before{transform:rotate(45deg)}
details.study .body{padding:0 20px 16px;display:flex;flex-direction:column;gap:8px;font-size:var(--fs-md)}
details.study .body ul li{margin-bottom:2px}
details.study .cite{font-size:var(--fs-sm);color:var(--muted)}
details.study .body .claim{border-top:1px solid var(--rule);padding-top:8px;margin-top:4px}
details.study .body .claim b{font-weight:600}
.tone{border-radius:12px;padding:14px 18px;border:1px solid}
.tone.green{background:var(--green-tint);border-color:var(--green-text)}
.tone.amber{background:var(--amber-tint);border-color:var(--amber)}
.tone.grey{background:var(--grey-tone);border-color:var(--grey-tone-border)}
.tone.purple{background:#eee0ff;border-color:var(--purple)}
.tone.info{background:var(--info-tint);border-color:var(--info)}
.tone .phrase{font-weight:600}
.tone.green .phrase{color:var(--green-text)}
.tone.amber .phrase{color:var(--amber-text)}
.tone.grey .phrase{color:var(--grey-tone-border)}
.tone.purple .phrase{color:var(--purple)}
.tone .again{display:block;margin-top:6px;font-size:var(--fs-sm)}
.takeaway{background:var(--takeaway-tint);border-radius:12px;padding:16px 20px;position:relative;overflow:hidden}
.takeaway::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--takeaway)}
.takeaway h3{margin-bottom:6px}
.unit{background:var(--unit-tint);border-radius:12px;padding:20px 24px;position:relative;overflow:hidden}
.unit::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--unit)}
.unit h2{margin-bottom:8px}
.unit p+p{margin-top:10px}
.intro-panel h3{margin-bottom:8px}
.intro-panel .numbered{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.intro-panel .numbered li{display:flex;gap:12px;align-items:flex-start}
.intro-panel .numbered .badge{flex:none;width:30px;height:30px;border-radius:50%;background:var(--text);color:#fff;font-size:var(--fs-sm);font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:-2px}

/* Options (ExplainedOption) */
.optgroup{display:flex;flex-direction:column;gap:10px}
.optgroup legend{font-weight:600;margin-bottom:6px;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.opt{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;border:2px solid var(--option-border);border-radius:9px;padding:12px 16px;background:#fff;cursor:pointer;position:relative}
.opt:hover{background:var(--purple-hover)}
.opt input{margin:4px 0 0;width:18px;height:18px;flex:none;accent-color:var(--purple)}
.opt .label{flex:1;min-width:0}
.opt .label small{display:block;color:var(--muted);font-size:var(--fs-sm);font-weight:300;margin-top:2px}
.opt.selected{border-color:var(--purple);background:var(--purple-tint)}
.opt.correct{border-color:var(--green);background:var(--green-tint)}
.opt.incorrect{border-color:var(--red);background:var(--red-tint)}
.opt.readonly{cursor:default}
.opt.readonly:hover{background:inherit}
.opt.readonly.correct:hover{background:var(--green-tint)}
.opt.readonly.incorrect:hover{background:var(--red-tint)}
.opt.readonly.selected:hover{background:var(--purple-tint)}
.opt.knocked{cursor:default;border-color:var(--red);background:var(--red-tint)}
.opt.knocked:hover{background:var(--red-tint)}
.opt.knocked input{accent-color:var(--red)}
.opt.knocked .mark{color:var(--red)}
.opt .mark{width:24px;height:24px;flex:none;margin-top:1px}
/* ExplainedOption: the explanation reveals inside the card, indented under the label, above a thin rule. */
.opt .expl{flex-basis:100%;display:block;margin-left:30px;margin-top:-4px;font-size:var(--fs-md);color:var(--text);cursor:default}
.opt.knocked .expl{color:var(--text)}
.opt .expl .phrase{font-weight:600}
.opt .expl .phrase.green{color:var(--green-text)} .opt .expl .phrase.amber{color:var(--amber-text)} .opt .expl .phrase.grey{color:var(--grey-tone-border)}
.opt .expl .ev{display:block;margin-top:6px;font-size:var(--fs-sm)}
.opt .expl .verdict{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-weight:600}
.opt .expl .verdict svg{width:22px;height:22px;flex:none}
.opt .expl .verdict.ok{color:var(--green-text)} .opt .expl .verdict.bad{color:var(--red)}
.opt .mark.muted{color:#767676}
.opt.correct .mark{color:var(--green)}
.opt.incorrect .mark{color:var(--red)}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 16px;border:1px solid}
.alert svg{width:24px;height:24px;flex:none}
.alert.ok{background:var(--green-tint);border-color:var(--green-text)} .alert.ok svg{color:var(--green)}
.alert.bad{background:var(--red-tint);border-color:var(--red)} .alert.bad svg{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);border:1px solid var(--option-border);border-radius:999px;padding:3px 12px;align-self:flex-end;background:#fff}
.chip.done{border-color:var(--green-text);background:var(--green-tint);color:var(--green-text)}
.chip svg{width:16px;height:16px}

/* Face key, inside a collapsible drawer under the flock strip */
details.legend{margin-top:10px;border-top:1px solid var(--rule);padding-top:8px}
details.legend summary{cursor:pointer;font-weight:600;font-size:var(--fs-sm);list-style:none;display:flex;align-items:center;gap:8px;padding:4px 0}
details.legend summary::-webkit-details-marker{display:none}
details.legend summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--text);border-bottom:2px solid var(--text);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-left:2px}
details.legend[open] summary::before{transform:rotate(45deg)}
.key{padding-top:8px}
.key ol{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.key li{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:var(--fs-xs);line-height:1.25}
.key li svg{width:36px;height:36px;overflow:visible}
.key li b{font-weight:600;font-size:var(--fs-sm)}
.key .scale{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted);margin-top:8px;border-top:1px solid var(--rule);padding-top:6px}
@media (max-width:420px){.key ol{gap:4px}.key li svg{width:30px;height:30px}}

/* Flock strip: all 40 heads in one line across the top of the page. Small phones fall back to four rows of 10. */
.strip{padding:12px 20px}
.strip .top{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.strip .top .sub b{color:var(--text);font-weight:600}
.strip .top h3{font-size:var(--h4)}
.strip .top .sub{font-size:var(--fs-sm);color:var(--muted)}
.flock{display:grid;grid-template-columns:repeat(40,minmax(0,1fr));gap:3px}
@media (max-width:559px){.flock{grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}}
.head{width:100%;aspect-ratio:1;max-width:100%;transition:opacity .5s,filter .5s;display:block;overflow:visible}
.head.out{opacity:.2;filter:grayscale(1)}
.flock-panel h3{margin-bottom:4px}
.flock-panel .sub{font-size:var(--fs-sm);color:var(--muted);margin-bottom:4px}
.flock-panel .sub:empty{display:none}
.flock.sample{display:flex;flex-wrap:wrap;gap:4px;min-height:32px;align-content:flex-start}
.flock.sample .head{width:28px;height:28px}
.head.in-sample{animation:pop .45s ease-out both}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.empty{color:var(--muted);font-size:var(--fs-sm);grid-column:1/-1;padding:16px 0;text-align:center}
.weeks{margin:0 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.weeks .now{font-size:var(--fs-md);font-weight:600;min-height:1.3em}
.weeks ol{list-style:none;padding:0;margin:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.weeks .wks{display:flex;gap:6px;flex-wrap:wrap}
.weeks .wk{font:inherit;border:1px solid var(--rule);border-radius:8px;padding:4px 10px;font-size:var(--fs-sm);color:var(--muted);min-width:56px;text-align:center;background:#fff;cursor:pointer}
.weeks .wk:disabled{cursor:default}
/* A still view: the heads and meter snap to a week instead of animating into it. */
.still, .still *{transition:none!important;animation:none!important}
.weeks .wk:not(:disabled):hover{background:var(--purple-hover)}
.weeks .wk.done{border-color:var(--purple);background:var(--purple-tint);color:var(--text)}
.weeks .wk.now-wk{border-color:var(--purple);background:var(--purple);color:#fff;font-weight:600}
.weeks .hint{font-size:var(--fs-xs);color:var(--muted)}
.flock-panel .status{font-size:var(--h3);font-weight:700;min-height:1.3em;margin-bottom:2px}
.flock-panel .pct{font-size:var(--h4);font-weight:600;color:var(--purple);min-height:1.3em;margin-bottom:0}

.flock-panel .pct:empty{display:none}
.flock-panel .status:empty{display:none}
.runrow{display:flex;justify-content:flex-start;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 8px}
.weeks{align-items:flex-start}
.weeks ol{justify-content:flex-start}

/* Run and result cards: two halves that wrap to one column when narrow. A hidden half takes no space. */
.runbody{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-start}
.runbody > div{flex:1 1 300px;min-width:0}
.runbody .meter{margin-top:0;border-top:0;padding-top:0}
.runbody h3{margin-bottom:6px}
.titlerow{display:flex;align-items:center;justify-content:flex-start;gap:8px 16px;flex-wrap:wrap;margin-bottom:8px}
.titlerow h3{margin:0}
.rungrp{display:flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0 12px;text-align:center}
.rungrp .btn{min-width:240px;font-size:var(--fs-lg);padding:12px 24px}
.rungrp .lead{font-weight:600;font-size:var(--fs-md)}
details.src .key p{font-size:var(--fs-sm);color:var(--text)}
#meter-wrap.ghost{display:none}
#run-card .runbody{scroll-margin-top:calc(var(--header-h) + env(safe-area-inset-top,0px) + 150px)}
.fixcard{scroll-margin-top:calc(var(--header-h) + env(safe-area-inset-top,0px) + 12px)}
.rungrp .btn{min-width:196px;justify-content:center}
.rungrp .sub{margin:0}
/* What-if possibilities as pills inside the run card, after the run */
.whatif{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
.whatif h4{font-size:var(--fs-md);margin-bottom:8px;display:flex;gap:4px 12px;flex-wrap:wrap;align-items:baseline}
.whatif h4 .sub{font-weight:400}
.whatif .pills{justify-content:center}
.whatif h4{justify-content:flex-start;text-align:left}
.whatif .tone{margin-top:10px}
.statrow{display:flex;align-items:baseline;gap:4px 16px;flex-wrap:wrap;margin-top:8px}
.statrow.full{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;margin:0 0 10px}
.statrow.full > div{flex:1 1 300px;min-width:0}
.statrow.full > .stat{flex-grow:1.3}
.statrow.full .stat{display:flex;align-items:baseline;gap:4px 16px;flex-wrap:wrap}
.statrow.full .status,.statrow.full .pct{white-space:nowrap}
.statrow.full .stat .sub{flex:1 1 100%;margin:0}
.statrow.full .status{font-size:var(--h4)} .statrow.full .pct{font-size:var(--fs-md)}
.runbody > div:first-child{flex-grow:1.3}
.statrow.full .mt{margin:0;font-size:var(--h4)}
.meter.notitle .mtitle{display:none}
.fixcard .statrow{margin:0 0 10px}
@media (max-width:720px){.statrow.full .mt{display:none}.statrow.full > div{flex-basis:100%}.meter.notitle .mtitle{display:flex}}
.statrow .status,.statrow .pct{margin:0}

.card.flock-panel{padding-top:10px}
.runbody .status{margin-top:2px}
/* Remedy chooser: one row of pills directly above the result card, so a selection and its effect sit together. */
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chiprow{display:flex;justify-content:flex-end;margin-top:8px}
.chiprow.top{margin:0 0 8px;min-height:0}
.chiprow.top:empty{display:none}
legend.qrow{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;width:100%}
legend.qrow .chip{align-self:center}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;flex-wrap:wrap}
.cardhead .chip{align-self:center}
/* Fix page: one card holds everything a remedy changes: verdict band, estimates, meter, evidence */
.fixcard{overflow:visible}
.vband{display:flex;gap:10px;align-items:flex-start;margin:12px -20px 14px;padding:12px 20px;border-top:1px solid;border-bottom:1px solid}
.fixcard .pills{margin-top:2px}
.fixcard .vband[hidden] + .runbody{margin-top:14px}
.vband.ok{background:var(--green-tint);border-color:var(--green-text)} .vband.ok > svg{color:var(--green)}
.vband.bad{background:var(--red-tint);border-color:var(--red)} .vband.bad > svg{color:var(--red)}
.vband > svg{width:24px;height:24px;flex:none}
.vband .phrase{font-weight:600}
.vband .phrase.green{color:var(--green-text)} .vband .phrase.amber{color:var(--amber-text)} .vband .phrase.grey{color:var(--grey-tone-border)}
.evline{margin-top:12px;border-top:1px solid var(--rule);padding-top:8px;font-size:var(--fs-sm);color:var(--muted)}
.evline b{color:var(--text)}
@keyframes grow{from{width:0}}
.tried .trow.cur .tb i{animation:grow .6s ease-out}
.pill{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--option-border);border-radius:999px;padding:8px 16px;background:#fff;color:var(--text);font:inherit;line-height:1.2;min-height:44px;text-align:left}
.pill:hover{background:var(--purple-hover)}
.pill[aria-pressed="true"]{border-color:var(--purple);background:var(--purple-tint);font-weight:600}
.pill svg{width:18px;height:18px;flex:none}
.pill .ok{color:var(--green)} .pill .bad{color:var(--red)}
.fix-fb .alert .sub{color:var(--muted);font-size:var(--fs-sm)}
.fix-fb .alert .ev{display:block;margin-top:6px;font-size:var(--fs-sm)}
.fix-fb .alert .phrase{font-weight:600}
.fix-fb .alert .phrase.green{color:var(--green-text)} .fix-fb .alert .phrase.amber{color:var(--amber-text)} .fix-fb .alert .phrase.grey{color:var(--grey-tone-border)}
.fix-fb .alert .verdict{display:block;margin-bottom:6px;font-weight:600}
/* Estimates so far (fix page): one thin bar per remedy tried, dashed line at the true value. */
.tried{margin-top:0}
.tried h4{font-size:var(--fs-md);margin-bottom:2px}
.tried .trow{display:grid;grid-template-columns:minmax(90px,30%) minmax(0,1fr) 5em;gap:8px;align-items:center;font-size:var(--fs-sm);padding:2px 0}
.tried .trow .tl{color:var(--muted);line-height:1.25}
.tried .trow.cur .tl,.tried .trow.cur .tv{color:var(--purple);font-weight:600}
.tried .tb{position:relative;height:10px;background:var(--panel);border:1px solid var(--rule);border-radius:5px}
.tried .tb i{position:absolute;left:0;top:0;bottom:0;background:var(--mid-gray);border-radius:0 4px 4px 0;transition:width .6s}
.tried .trow.cur .tb i{background:var(--purple)}
.tried .tb em{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--takeaway);transform:translateX(-50%)}
.tried .tv{font-variant-numeric:tabular-nums;min-width:0;white-space:nowrap;text-align:right}
.tried .trow.untried .tv{color:var(--muted);font-weight:300;font-size:var(--fs-xs)}
.tried .trow.untried .tb{border-style:dashed}
.tried .cap{font-size:var(--fs-xs);color:var(--muted);margin-top:4px}
.tried .cap i{display:inline-block;width:12px;border-top:2px dashed var(--takeaway);vertical-align:middle;margin-right:4px}
.head.new{animation:pop .45s ease-out both}

/* Meter (nested inside a card) */
.meter{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
.meter .mtitle{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.meter .mtitle h4{margin:0}
.tip{position:relative;display:inline-flex}
.tip > button{all:unset;cursor:help;width:24px;height:24px;border-radius:50%;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.tip > button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.tip > button svg{width:22px;height:22px}
.tip .bubble{position:absolute;left:0;bottom:calc(100% + 8px);background:#202020;color:#fff;font-size:var(--fs-sm);font-weight:300;line-height:1.4;padding:8px 34px 8px 10px;border-radius:8px;width:min(340px,80vw);z-index:6;display:none;outline:1px solid #fff;text-align:left}
/* Close control inside the bubble, so a learner on a touch screen can always dismiss it (same pattern as vtr-sb-01's axis definitions). */
.tip .tclose{all:unset;cursor:pointer;position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:1.2rem;line-height:1}
.tip .tclose:hover{background:rgba(255,255,255,.18)}
.tip .tclose:focus-visible{outline:2px solid #fff;outline-offset:1px}
/* Defined term: the word itself opens the definition. Dotted purple underline, same bubble and touch behaviour as the (i) tooltips. */
.tip.dterm{display:inline;position:relative}
.tip.dterm > .ttrig{all:unset;cursor:help;font:inherit;color:inherit;border-bottom:2px dotted var(--purple);text-decoration:none;display:inline}
.tip.dterm > .ttrig:hover,.tip.dterm > .ttrig[aria-expanded="true"]{color:var(--purple)}
.tip.dterm > .ttrig:focus-visible{outline:3px solid var(--purple);outline-offset:2px;border-radius:2px}
.tip.dterm .bubble{font-weight:400}
.tip.r .bubble{left:auto;right:0}
.tip.r .bubble::after{left:auto;right:6px}
.readout .tip > button{width:20px;height:20px;margin-right:2px}
.readout .tip > button svg{width:18px;height:18px}
.tip .bubble::after{content:"";position:absolute;left:6px;top:100%;border:7px solid transparent;border-top-color:#202020}
@media (hover:hover){.tip:hover .bubble,.tip:focus-within .bubble{display:block}}
.tip.open .bubble{display:block}
.meter .track{position:relative;height:14px;background:var(--panel);border:1px solid var(--rule);border-radius:7px;margin:34px 10px 30px}
.meter .tag{position:absolute;transform:translateX(-50%);font-size:var(--fs-xs);white-space:nowrap;transition:left .6s;font-weight:600}
.meter .tag.truth{top:-32px;color:var(--takeaway)}
.meter .tag.est{top:18px;color:var(--purple);border:2px solid var(--purple);border-radius:6px;padding:1px 6px;background:#fff}
.meter .tag.base{top:-32px;color:var(--muted);font-weight:400}
.meter .gap{position:absolute;top:0;bottom:0;background:var(--amber-tint);border-left:1px dashed var(--amber-text);border-right:1px dashed var(--amber-text);transition:left .6s,width .6s}
.meter .pin{position:absolute;top:50%;width:4px;height:30px;border-radius:2px;transform:translate(-50%,-50%);transition:left .6s}
.meter .pin.truth{background:var(--takeaway)}
.meter .pin.est{background:var(--purple)}
.meter .basepin{position:absolute;top:50%;width:0;height:30px;border-left:2px dashed var(--mid-gray);transform:translate(-50%,-50%);transition:left .6s}
.meter .ticks{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted);margin:0 10px}
.meter{container-type:inline-size}
.meter .readout{display:flex;gap:4px 20px;flex-wrap:wrap;margin:2px 0 0;font-size:var(--fs-md)}
.meter .readout > span{display:inline-flex;align-items:center;gap:0 4px;flex-wrap:wrap}
.meter .readout > span > b{margin-left:.3em}
.readout .tip{align-items:center}
/* The readout steps down the type scale as the meter's own width shrinks, so True value, Estimate and Gap stay on one line. */
@container (max-width:520px){.meter .readout{font-size:var(--fs-sm);gap:4px 12px}.readout .tip > button{width:18px;height:18px}.readout .tip > button svg{width:16px;height:16px}}
@container (max-width:420px){.meter .readout{font-size:var(--fs-xs);gap:4px 10px}}
.meter .readout b{font-weight:600}
.meter .readout .gapval{color:var(--amber-text)}

/* Share chart (judge page): one proportion as a thin bar with the headline number. */
.share{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 16px;align-items:center;margin-bottom:4px}
.share .big{font-size:var(--h2);font-weight:700;color:var(--purple);line-height:1.1;min-width:3.2ch}
.share .lbl{font-size:var(--fs-md);font-weight:600}
.share .bar{grid-column:1/-1;height:10px;background:var(--panel);border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.share .bar i{display:block;height:100%;background:var(--purple);border-radius:0 4px 4px 0;transition:width .6s}
.share .axis{grid-column:1/-1;display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted)}

/* Funnel */
.funnel{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;margin-top:8px}
.funnel .st{flex:1;min-width:120px;border:1px solid var(--rule);border-radius:10px;padding:8px 12px;background:#fff;display:flex;flex-direction:column;gap:0}
.funnel .st .n{font-size:var(--h3);font-weight:700;line-height:1.2}
.funnel .st .lbl{font-size:var(--fs-sm);line-height:1.3}
.funnel .st .note{font-size:var(--fs-xs);color:var(--muted);line-height:1.3}
.funnel .arrow{align-self:center;color:var(--muted);font-size:var(--fs-lg)}
.funnel .st.leak{border-color:var(--purple);border-style:dashed;background:var(--purple-tint)}
.funnel .st.result{background:var(--amber-tint);border-color:var(--amber)}
.funnel button.st{font:inherit;color:inherit;text-align:left;cursor:pointer;position:relative;padding-right:34px}
.funnel button.st:hover{background:var(--purple-hover)}
.funnel button.st.selected{border-color:var(--purple);background:var(--purple-tint)}
.funnel button.st.correct{border-color:var(--green);background:var(--green-tint);cursor:default}
.funnel button.st.knocked{cursor:default;color:var(--muted)}
.funnel button.st.knocked:hover{background:#fff}
.funnel button.st .mark{position:absolute;right:8px;top:8px;width:22px;height:22px}
.funnel button.st.correct .mark{color:var(--green)}
.funnel button.st.knocked .mark{color:#767676}
.funnel button.st .pick{font-size:var(--fs-xs);color:var(--purple);margin-top:4px;font-weight:600}
.funnel .st.leak{border-color:var(--green);border-style:solid;background:var(--green-tint)}
.funnel .st.result .n{color:var(--amber-text)}
.funnel .st.result .n small{font-size:var(--fs-sm);font-weight:400;color:var(--text)}
.leak-card h3{font-size:var(--h4)}

/* Takeaways page */
.recap-wrap h3{margin-bottom:12px}
.recaps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.recaps{grid-template-columns:1fr}}
.recap{border:1px solid var(--card-border);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column;gap:10px;padding:0 16px 16px;min-width:0}
.recap .band{height:6px;background:var(--purple);margin:0 -16px 4px}
.recap h4{margin:0}
.recap .bias{font-weight:600;color:var(--purple);margin-top:-6px}
.recap .funnel{margin-top:0}
.recap .funnel .st{min-width:96px;min-height:124px;padding:6px 8px}
.recap .funnel .st .n{font-size:var(--h4)}
.recap .funnel .st .lbl{font-size:var(--fs-xs)}
.recap .tried{margin-top:2px}
.recap p{font-size:var(--fs-sm)}
.tk{background:var(--takeaway-tint);border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.tk .band{margin:0;padding:12px 16px;background:var(--takeaway);color:#fff;font-size:var(--h3);font-weight:700;line-height:1.3}
.tk .body{padding:16px;display:flow-root}
.tk .raven{float:right;width:110px;height:98px;margin:-10px -6px 8px 16px;overflow:visible}
.tk .body p+p{margin-top:12px}

/* Ranking (fix page): one row per remedy, top is rank 1. Drag a row to a new position, or select a row and then the position it should take, as in the monolith's ranking boards (vtr-sap-02). With a row in hand, the other rows are the places it can go: dashed purple, the fill tracking the pointer. */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;border:2px solid var(--option-border);border-radius:9px;padding:8px 12px;background:#fff;cursor:grab;user-select:none;-webkit-user-select:none;transition:border-color .15s,background .15s,transform .15s,box-shadow .15s}
.rrow:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.rrow:active{cursor:grabbing}
.rrow:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.rrow .badge{width:28px;height:28px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--option-border);font-size:var(--fs-sm);font-weight:600}
.rrow > svg{width:20px;height:20px;color:var(--muted);flex:none}
.rrow .rl{flex:1;min-width:0}
.rrow .rl b{display:block;font-weight:600;font-size:var(--fs-sm)}
.rrow .rl small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.rrow .mark{width:24px;height:24px;flex:none}
.rrow.picked{border-color:var(--purple);background:var(--purple-tint);cursor:default}
.rrow.picked:hover{transform:none;box-shadow:none}
.rrow.elig{border-style:dashed;border-color:var(--purple);cursor:pointer}
.rrow.elig:hover,.rrow.over{background:var(--purple-hover)}
.rrow.elig:hover{transform:none;box-shadow:none}
.rrow.dragging{opacity:.35}
.rrow.locked{cursor:default} .rrow.locked:hover{transform:none;box-shadow:none}
.rrow.ok{border-color:var(--green);background:var(--green-tint)} .rrow.ok .mark{color:var(--green)} .rrow.ok .badge{border-color:var(--green);background:#fff}
.rrow.bad{border-color:var(--red);background:var(--red-tint)} .rrow.bad .mark{color:var(--red)}
.rank-card h3{margin-bottom:4px}
.rank-card > .lead{font-weight:600;margin-bottom:12px}
.rank-card .actions{margin-top:12px;align-items:center}
/* The bar that covers the footer while a card is in hand: what was picked, and how to put it down. */
.pickbar{position:fixed;left:0;right:0;bottom:0;z-index:25;height:calc(var(--footer-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--purple);color:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 -2px 10px rgba(0,0,0,.2);animation:rise .22s ease-out}
.pickbar p{flex:1;min-width:0;margin:0;font-size:var(--fs-md)}
.pickbar p b{font-weight:600}
.pickbar .btn{border-color:#fff;color:#fff;background:transparent;padding:6px 14px;min-height:36px}
.pickbar .btn:hover{background:rgba(255,255,255,.15)}
.pickbar .btn svg{width:18px;height:18px}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@media (max-width:560px){.pickbar p{font-size:var(--fs-sm)}}

/* Hint (orange is reserved for hints): centered pill, swapped for a pale orange card with an orange left rule */
:root{--hint:#FFA800;--hint-fill:#fff3e0;--hint-fill-strong:#FFD480}
.hint-wrap{display:flex;justify-content:center;margin:12px 0 0}
.hint-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:24px;border:1.5px solid var(--hint);background:var(--hint-fill);color:var(--text);font:inherit;font-size:var(--fs-sm);font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
.hint-pill:hover{background:var(--hint-fill-strong);transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,168,0,.25)}
.hint-pill svg{width:20px;height:20px;color:var(--hint)}
.hint-card{position:relative;background:var(--hint-fill);border-left:4px solid var(--hint);border-radius:4px;padding:16px 40px 16px 16px;margin:12px 0 0}
.hint-card .hh{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-weight:600}
.hint-card .hh svg{width:20px;height:20px;color:var(--hint)}
.hint-card .hx{all:unset;cursor:pointer;position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.hint-card .hx:hover{color:var(--text)} .hint-card .hx:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.hint-card .hx svg{width:18px;height:18px}

/* Congrats */
.ravens{display:flex;justify-content:center;gap:20px;margin:4px 0}
.ravens svg{width:80px;height:80px;overflow:visible}
.congrats-card{background:var(--unit-tint);border-radius:12px;padding:0 0 20px;position:relative;overflow:hidden;text-align:center}
.congrats-card .band{height:10px;background:var(--unit)}
.congrats-card h2{padding:20px 24px 12px}
.congrats-card .msg{padding:0 24px;text-align:left;display:flex;flex-direction:column;gap:10px}
.congrats .actions{justify-content:center}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const live = (msg) => { const el = $('#live'); if (el) { el.textContent = ''; setTimeout(() => { el.textContent = msg; }, 30); } };

/* ---------- One face scale for both rounds: health / symptom burden, 1 (well) to 5 (unwell) ---------- */
const GROUPS = [
  { face:'happy',      label:'Well',            short:'Well',          score:1, n:10 },
  { face:'default',    label:'Mostly well',     short:'Mostly well',   score:2, n:12 },
  { face:'worried',    label:'Some symptoms',   short:'Some symptoms', score:3, n:9 },
  { face:'sweat-drop', label:'Many symptoms',   short:'Many symptoms', score:4, n:6 },
  { face:'stressed',   label:'Seriously unwell',short:'Seriously unwell', score:5, n:3 },
];
const N = GROUPS.reduce((a,g)=>a+g.n,0); // 40
function buildFlock(){
  const queues = GROUPS.map((g,gi) => Array.from({length:g.n},(_,k)=>({ id:`${gi}-${k}`, g:gi, k })));
  const out = []; let any = true;
  while (any) { any = false; queues.forEach(q => { if (q.length) { out.push(q.shift()); any = true; } }); }
  let s = 7;
  for (let i = out.length - 1; i > 0; i--) { s = (s * 1103515245 + 12345) % 2147483648; const j = s % (i + 1); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}
const FLOCK = buildFlock();
const byId = id => FLOCK.find(x => x.id === id);
const gOf = id => GROUPS[byId(id).g];
const POOR = new Set(FLOCK.filter(x => GROUPS[x.g].score >= 4).map(x => x.id));

/* Round 1: UK Biobank style enrollment. Truth = share of invitees in poorer health (score 4 or 5) = 9/40. */
const R1_TRUTH = GROUPS.filter(g=>g.score>=4).reduce((a,g)=>a+g.n,0) / N; // 0.225
const ENROL = {               // probability of signing up, by health group
  base:      [.70,.50,.33,.17,.00],
  more:      [.70,.50,.33,.17,.00],
  motivate:  [.90,.70,.45,.30,.10],
  pay:       [.80,.62,.45,.30,.15],
  monitor:   [.70,.52,.45,.40,.33],
  outreach:  [.62,.58,.52,.48,.40],
};
function simR1(remedy){
  const r = Array.isArray(remedy) ? remedy : (ENROL[remedy] || ENROL.base);
  const enrolled = [];
  GROUPS.forEach((g,gi) => { const pool = FLOCK.filter(x=>x.g===gi); pool.slice(0, Math.round(pool.length*r[gi])).forEach(x=>enrolled.push(x.id)); });
  const poor = enrolled.filter(id => gOf(id).score>=4).length;
  return { enrolled, share: enrolled.length ? poor/enrolled.length : 0 };
}
/* Round 2: remote smartphone study, weekly symptom check-ins. Truth = average symptom score of everyone enrolled = 2.5. */
const R2_TRUTH = GROUPS.reduce((a,g)=>a+g.score*g.n,0) / N;
const RETAIN = {              // weekly retention, by symptom group (people with the condition stay longer)

function simR2(remedy){
  const r = Array.isArray(remedy) ? remedy : (RETAIN[remedy] || RETAIN.base);
  const invited = remedy === 'random' ? new Set(FLOCK.filter((_,i)=>i%2===0).map(x=>x.id)) : null;
  const weeks = [];
  for (let w=1; w<=6; w++) {
    const ids = [];
    GROUPS.forEach((g,gi) => { const pool = FLOCK.filter(x=>x.g===gi && (!invited || invited.has(x.id))); pool.slice(0, Math.round(pool.length*0.9*Math.pow(r[gi], w-1))).forEach(x=>ids.push(x.id)); });
    const mean = ids.length ? ids.reduce((a,id)=>a+gOf(id).score,0)/ids.length : 0;
    weeks.push({ ids, mean });
  }
  return { weeks, invited, final: weeks[5] };
}

function closeTips(except=null){ $$('.tip.open').forEach(t => { if (t !== except) { t.classList.remove('open'); const b = $('.ttrig', t); if (b) b.setAttribute('aria-expanded', 'false'); } }); }
function fitTips(root=document){
  $$('.tip', root).forEach(t => {
    if (t.dataset.wired) return; t.dataset.wired = '1';
    const trig = $('.ttrig', t), bubble = $('.bubble', t);
    const fit = () => { t.classList.remove('r'); const r = bubble.getBoundingClientRect(); if (r.right > window.innerWidth - 8) t.classList.add('r'); };
    const open = () => { closeTips(t); t.classList.add('open'); trig.setAttribute('aria-expanded', 'true'); fit(); };
    const close = () => { t.classList.remove('open'); trig.setAttribute('aria-expanded', 'false'); };
    t.addEventListener('mouseenter', fit); t.addEventListener('focusin', fit);
    trig.addEventListener('click', e => { e.stopPropagation(); if (t.classList.contains('open')) close(); else open(); });
    bubble.addEventListener('click', e => { e.stopPropagation(); close(); });

  });
  if (!document.body.dataset.tipsWired) { document.body.dataset.tipsWired = '1'; document.addEventListener('click', () => closeTips()); document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTips(); }); }

function keepIn(tag, pctVal){ const track = tag.parentElement; const tw = tag.offsetWidth, w = track ? track.offsetWidth : 0; if (!tw || !w) { tag.style.left = pctVal + '%'; return; } const half = tw / 2 / w * 100; tag.style.left = Math.max(half, Math.min(100 - half, pctVal)) + '%'; }
function setMeter(cfg, est){
  const pct = v => Math.max(0, Math.min(100, ((v - cfg.min) / (cfg.max - cfg.min)) * 100));

  e.hidden = false; t.hidden = false;
  e.style.left = pct(est) + '%'; t.textContent = cfg.estLabel + ': ' + cfg.fmt(est); keepIn(t, pct(est));
  const g = $('#m-gap'); g.hidden = false; const lo = Math.min(pct(est), pct(cfg.truth)), hi = Math.max(pct(est), pct(cfg.truth));

/* Faint dashed marker for the no-remedy estimate, so a remedy's movement has a reference point. */
function setBasePin(cfg, est){ const pct = v => Math.max(0, Math.min(100, ((v - cfg.min) / (cfg.max - cfg.min)) * 100)); const b = $('#m-base'), t = $('#m-base-tag'); b.hidden = false; t.hidden = false; b.style.left = pct(est)+'%'; t.textContent = 'No new strategy: ' + cfg.fmt(est); keepIn(t, pct(est)); }
const METER1 = { title:'Percent in poorer health', min:0, max:.5, truth:R1_TRUTH, ticks:['0%','10%','20%','30%','40%','50%'], estLabel:'Cohort\'s estimate', fmt:v=>Math.round(v*100)+'%', fmtGap:v=>(v>=0?'+':'')+Math.round(v*100)+' points',

/* `knocked` lists option ids already tried and ruled out: mid grey, locked, stated in text. */
/* `expl(o)` returns the explanation to reveal inside that option's card (ExplainedOption pattern), or '' for none.
   `markOf(o)` can supply a mark for an option that is neither graded nor knocked (used for remedies already tried). */
function optionsHTML(name, opts, chosen, done, graded, knocked=[], expl=null, markOf=null){
  return opts.map(o => {
    let cls = 'opt'; const sel = chosen === o.id; const ko = knocked.includes(o.id);
    let mark = '';
    if (ko) { cls += ' knocked'; mark = `<svg class="mark" aria-hidden="true"><use href="#i-x"/></svg><span class="vh">previously selected, incorrect</span>`; }
    else if (done) { cls += ' readonly'; if (graded) { if (sel && o.correct) cls += ' correct'; else if (sel) cls += ' incorrect'; } else if (sel) cls += ' selected'; }
    else if (sel) cls += ' selected';
    if (done && graded && sel && !ko) mark = `<svg class="mark" aria-hidden="true"><use href="#${o.correct?'i-check':'i-x'}"/></svg><span class="vh">${o.correct?'correct answer':'incorrect'}</span>`;
    else if (!mark && markOf) mark = markOf(o) || '';
    const ex = expl ? (expl(o, { sel, ko }) || '') : '';
    return `<label class="${cls}"><input type="radio" name="${name}" value="${o.id}" id="${name}-${o.id}" ${sel?'checked':''} ${(done||ko)?'disabled':''} ${ex?`aria-describedby="${name}-${o.id}-x"`:''}><span class="label">${o.text}</span>${mark}${ex?`<span class="expl" id="${name}-${o.id}-x">${ex}</span>`:''}</label>`;
  }).join('');
}

/* Fix page: one bar per remedy tried, so each selection can be compared with the baseline and with earlier tries. */

  const rows = [{ id:'base', label:'No strategy', est:estOf('base'), shown:true }].concat(REM.map(r => ({ id:r.id, label:r.short, est:estOf(r.id), shown:R.best || R.tried.includes(r.id) })));
  const cur = R.remedy || 'base';

/* Apply a remedy key or a scenario rate array: dim the strip heads not in the sample, outline the ones a remedy brought in, and move the meter. */

  else { const r = simR2(which); ids = r.final.ids; est = ids.length ? r.final.mean : null; n = r.invited ? 20 : 40; status = `${ids.length} of ${n} still answering in week 6`; pct = `${Math.round(ids.length/n*100)}% of those ${r.invited?'prompted':'enrolled'}`; sub = `${n-ids.length} ${r.invited?'prompted ':''}ravens had stopped`; }

/* Animated run. */
let runToken = 0;
let showWeek = null;   // set by a round 2 run: jumps the display to a given week of the latest run
const WEEK_MS = 1500;
function runSim(round, remedy, { instant=false, onDone } = {}){
  const token = ++runToken;
  const quick = instant || reduced;
  const cfg = round===1 ? METER1 : METER2;
  const sample = $('#sample'), btn = $('#run-btn');
  if (btn) btn.setAttribute('aria-disabled','true');
  const stagger = quick ? 0 : 30;
  const showSample = (ids, still=false) => {
    const pop = still || quick;
    sample.innerHTML = ids.length ? ids.map((id,i) => head(gOf(id).face, pop?'':'in-sample', gOf(id).label).replace('<svg', `<svg style="animation-delay:${pop?0:i*stagger}ms"`)).join('') : '<p class="empty">Nobody</p>';
    $$('#pop .head').forEach((h,i) => { const inS = ids.includes(h.dataset.id); h.style.transitionDelay = pop ? '' : (i*12)+'ms'; h.classList.toggle('out', !inS); });
  };
  /* Looking back at a week after the run: everything snaps into place with no animation. */
  const stillParts = () => [$('#run-card'), $('#pop')].filter(Boolean);
  const snap = (fn) => { const els = stillParts(); els.forEach(el => el.classList.add('still')); fn(); void document.body.offsetWidth; els.forEach(el => el.classList.remove('still')); };
  const finish = () => { if (btn) { btn.setAttribute('aria-disabled','false'); btn.innerHTML = `${icon('i-redo')} Run again`; } if (onDone) onDone(); };
  if (round === 1) {
    const res = simR1(remedy);
    const s1 = () => { if (token!==runToken) return; $('#stage-now').textContent = `${res.enrolled.length} of 40 signed up`; $('#sample-pct').textContent = `${Math.round(res.enrolled.length/40*100)}% of those invited`; showSample(res.enrolled); $('#sample-sub').textContent = `${40-res.enrolled.length} never replied`; setMeter(cfg, res.share); live(`${res.enrolled.length} of 40 signed up, ${Math.round(res.enrolled.length/40*100)} percent. Estimate ${cfg.fmt(res.share)}, true value ${cfg.fmt(cfg.truth)}.`); finish(); };
    if (quick) s1(); else setTimeout(s1, 300);
    return res;
  } else {
    const res = simR2(remedy);
    const step = (w, auto=true) => {
      if (token!==runToken) return;
      const wk = res.weeks[w-1];
      const show = () => {
        showSample(wk.ids, !auto);
        if (res.invited) $$('#pop .head').forEach(h => { if (!res.invited.has(h.dataset.id)) h.classList.add('out'); });
        // During the run the weeks fill in as they pass; after it, every week stays light purple and the one being looked at is dark.
        for (let k=1;k<=6;k++){ const li=$('#wk-'+k); li.classList.toggle('done', auto ? k<w : true); li.classList.toggle('now-wk', k===w); }
        $('#week-now').textContent = `Week ${w} of 6`;
        $('#stage-now').textContent = `${wk.ids.length} of ${res.invited?20:40} answered in week ${w}`; $('#sample-pct').textContent = `${Math.round(wk.ids.length/(res.invited?20:40)*100)}% of those ${res.invited?'prompted':'enrolled'}`;
        $('#sample-sub').textContent = `${(res.invited?20:40)-wk.ids.length} ${res.invited?'prompted ':''}ravens did not answer this week`;
        setMeter(cfg, wk.ids.length ? wk.mean : null);
      };
      if (auto) show(); else snap(show);
      if (!auto) { live(`Week ${w}: ${wk.ids.length} answered. ${wk.ids.length ? 'Estimate '+cfg.fmt(wk.mean) : 'No estimate'}.`); return; }
      if (w<6) setTimeout(()=>step(w+1), WEEK_MS); else { live(`Week 6: ${wk.ids.length} answered. ${wk.ids.length ? 'Estimate '+cfg.fmt(wk.mean)+', ' : 'No estimate, '}true value ${cfg.fmt(cfg.truth)}.`); $$('#wks .wk').forEach(b => { b.disabled = false; }); finish(); }
    };
    $$('#wks .wk').forEach(b => { b.disabled = true; });
    showWeek = (w) => step(w, false);
    if (quick) step(6); else step(1);
    return res;
  }
}

/* ---------- Render ---------- */
const main = $('#main'), footer = $('#footer'), footerWrap = $('#footer-wrap');
function render(){
  const p = PAGES[state.page];
  window.scrollTo({ top:0, behavior:'instant' });
  main.classList.toggle('no-footer', p.kind==='congrats');
  if (p.kind === 'intro') renderIntro();
  else if (p.kind === 'congrats') renderCongrats();
  else {
    const step = state.page;
    const bar = `<div class="progress" aria-label="Progress"><div class="blocks">${Array.from({length:WORKING},(_,i)=>`<span class="${i<step?'done':''}"></span>`).join('')}</div><div class="labels"><b>${p.left}</b><span>Step ${step} of ${WORKING}</span></div></div>`;
    if (p.kind === 'predict') renderPredict(p.round, bar);
    else if (p.kind === 'run') renderRun(p.round, bar);
    else if (p.kind === 'leak') renderLeak(p.round, bar);
    else if (p.kind === 'takeaways') renderTakeaways(bar);

  renderFooter();
}

function renderIntro(){

      <p><b>Volunteer bias</b> is the type of bias that arises when only those who volunteer to participate in a study are included, and this decision, ability, or willingness to participate is typically related to the research question.</p>
      <p><b>Non-response bias</b> arises when participants who do not respond to a survey or study differ systematically from those who do.</p></section>
    <section class="card intro-panel"><h3>Your Goal</h3>
      <p>In this activity, your goal is to reference a study and see what happens when the ${dt('sample')} of those recruited doesn't accurately reflect the ${dt('population')} that the researchers aim to study. You will gain an understanding of the difference between <b>volunteer bias</b> and <b>non-response bias</b>. Then, you will strategize on how you can prevent or mitigate these biases from occurring so that your results are impacted less.</p></section>
    <section class="card intro-panel"><h3>What You're About To Do</h3>
      <ol class="numbered">${[

function renderPredict(round, bar){

  const body = round===1
    ? 'UK Biobank mails an invitation to every adult aged 40 to 69 near an assessment center. Choose who you expect to sign up.'
    : 'Everyone enrolled in the smartphone study is prompted to complete a symptom check-in each week for six weeks. Choose who you expect to still be answering by week 6.';
  const pre = round===2 ? `<section class="tone info precontext"><h3>Next Study to Assess</h3><p>This is a <b>different study</b> with a different research question. Here, a group investigates a remote smartphone study where everyone has already enrolled and the researchers wondered who would keep answering the survey. Read the study details below before you predict.</p></section>` : '';
  main.innerHTML = `<div class="col">${bar}${pre}
    <section class="card icard"><h2>${title}</h2><p>${body}</p></section>
    <details class="study" open><summary>Study details</summary><div class="body">${round===1?STUDY1:STUDY2}</div></details>

  </div>`;

/* Run page: the run card (faces, meter, then the what-if possibilities), and once all four possibilities are viewed, the inference question. */
function renderRun(round, bar){
  const R = round===1 ? state.r1 : state.r2;
  const SCEN = round===1 ? SCEN1 : SCEN2;
  const cfg = round===1 ? METER1 : METER2;
  const title = round===1 ? 'Run the study' : 'Run the study across six weeks';
  const body = round===1
    ? 'Now let\'s take a moment to run the study and see who signs up. Switch through the other possibilities to see how different samples can alter the results. Then make a judgment on the impact of the sample on the result.'
    : 'Press run and watch who keeps answering the survey, week by week. Switch through the other possibilities to see how different samples can alter the results. Then make a judgment on the impact of the sample on the result.';
  main.innerHTML = `<div class="col">${bar}
    <section class="card icard"><h2>${title}</h2><p>${body}</p></section>
    <details class="study"><summary>Study details</summary><div class="body">${round===1?STUDY1:STUDY2}</div></details>
    ${simPanelsHTML(round, round===1?'Run the study':'Run the six weeks', '', { meterHidden:!R.ran })}
  </div>`;
  setMeter(cfg, null);
  fitTips(); wireLegend();
  const runBtn = $('#run-btn');
  /* Comparison after the run: rerun instantly with each possibility. The gate waits until all have been seen. */
  const sp = $('#scen-pills');
  const seen = (id) => { if (!R.seen.includes(id)) R.seen.push(id); };
  const allSeen = () => SCEN.every(x => R.seen.includes(x.id));
  /* Possibilities as pills; the selected one's note sits right under the row. Viewed pills get a check. */
  const drawScen = () => { const s = SCEN.find(x => x.id === (R.scen || 'base'));
    sp.innerHTML = SCEN.map(x => `<button type="button" class="pill" data-id="${x.id}" aria-pressed="${x.id===s.id?'true':'false'}">${x.label}${R.seen.includes(x.id)?`<svg class="ok" aria-hidden="true"><use href="#i-check"/></svg><span class="vh">viewed</span>`:''}</button>`).join('');
    $('#scen-note').innerHTML = `<div class="tone purple">${s.note}</div>`; fitTips($('#scen-note'));
    const left = SCEN.length - R.seen.length; $('#seen-count').textContent = left ? `View all four to continue: ${left} left.` : 'All four viewed.'; $('#judge-card').hidden = !(R.ran && allSeen()); };
  const showWhatIf = () => { $('#whatif').hidden = !R.ran; $('#judge-card').hidden = !(R.ran && allSeen()); if (R.ran) drawScen(); };
  /* Inference question, graded on selection like the prediction. */
  const J = R.judge, q = IMPACT[round-1], jf = $('#judge-form');
  const explainJ = (o, { sel, ko }) => ko ? o.why : (sel && J.done ? q.feedback : '');
  const drawJudge = () => { $('fieldset', jf).innerHTML = `<legend>${q.question}</legend>` + optionsHTML('judge', q.options, J.pick, J.done, true, J.wrong, explainJ); };
  drawJudge();
  jf.addEventListener('change', e => { if (e.target.name!=='judge' || J.done) return; const pick = e.target.value, o = q.options.find(x => x.id === pick);
    if (!o.correct) { J.wrong.push(pick); J.pick = null; drawJudge(); return; }
    J.pick = pick; J.done = true; drawJudge(); renderFooter(); });
  sp.addEventListener('click', e => { const b = e.target.closest('.pill'); if (!b) return; R.scen = b.dataset.id; seen(R.scen); const s = SCEN.find(x => x.id === R.scen); drawScen(); $(`.pill[data-id="${R.scen}"]`, sp).focus({ preventScroll:true }); runSim(round, s.rates === 'base' ? 'base' : s.rates, { instant:true }); renderFooter(); });
  runBtn.setAttribute('aria-disabled', 'false');
  const wks = $('#wks'); if (wks) wks.addEventListener('click', e => { const b = e.target.closest('.wk'); if (!b || b.disabled || !showWeek) return; showWeek(+b.dataset.w); });
  showWhatIf();
  if (R.ran) { const s = SCEN.find(x => x.id === (R.scen || 'base')); runSim(round, s.rates === 'base' ? 'base' : s.rates, { instant:true }); }
  runBtn.addEventListener('click', () => { if (runBtn.getAttribute('aria-disabled')==='true') return; requestAnimationFrame(() => { const el = $('#run-card .runbody'); if (el) el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); }); $('#meter-wrap').classList.remove('ghost'); $('#run-out').hidden = false; $('#statrow').hidden = false; $('#src').hidden = false; R.scen = null; if (R.ran) drawScen(); runSim(round, 'base', { onDone(){ R.ran = true; seen('base'); showWhatIf(); renderFooter(); } }); });
}

function renderLeak(round, bar){
  const R = round===1 ? state.r1 : state.r2;
  const L = round===1 ? LEAK1 : LEAK2, W = round===1 ? WHY1 : WHY2;
  const cfg = round===1 ? METER1 : METER2;
  const res = round===1 ? simR1('base') : simR2('base');
  const est = round===1 ? res.share : res.final.mean;
  const counts = round===1 ? [40, res.enrolled.length, res.enrolled.length] : [40, res.weeks[0].ids.length, res.final.ids.length];
  const tile = (s, i) => {
    const sel = R.leak === s.id, ko = R.leakWrong.includes(s.id), ok = R.leakDone && s.correct;
    const cls = 'st' + (ok?' correct':'') + (ko?' knocked':'') + (sel && !ok && !ko?' selected':'');
    const n = counts[i];
    const mark = ok ? `<svg class="mark" aria-hidden="true"><use href="#i-check"/></svg><span class="vh">correct answer</span>` : ko ? `<svg class="mark" aria-hidden="true"><use href="#i-x"/></svg><span class="vh">previously selected, incorrect</span>` : '';
    const pick = (!R.leakDone && !ko) ? `<span class="pick">Select this option</span>` : '';
    return `<button type="button" class="${cls}" data-id="${s.id}" aria-pressed="${sel?'true':'false'}" ${(R.leakDone||ko)?'disabled':''}><span class="n">${n}</span><span class="lbl">${s.lbl}</span><span class="note">${s.note}</span>${pick}${mark}</button>`;
  };
  main.innerHTML = `<div class="col">${bar}
    <section class="card icard"><h2>Find where we lost some of the sample</h2><p>${round===1?'The cohort estimate shows that your sample is much healthier than the entire population.':'The study\'s average clinical symptom estimate ran high.'} In the flow chart below, select the stage of the experiment where participants in the sample drifted away from the true population. Then assess why this happened.</p></section>
    <details class="study"><summary>Study details</summary><div class="body">${round===1?STUDY1:STUDY2}</div></details>
    <section class="card leak-card"><h3 id="funnel-label">Here's what you found when you ran the study. Your ${round===1?'cohort\'s':'study\'s'} estimate was ${cfg.fmt(est)} while the true value is actually ${cfg.fmt(cfg.truth)}. How did this happen?</h3>
      <div class="funnel" role="group" aria-labelledby="funnel-label" id="funnel">${L.stages.map((s,i)=>tile(s,i)+(i<L.stages.length-1?'<span class="arrow" aria-hidden="true">&rarr;</span>':'')).join('')}</div>
      <div id="leak-feedback" style="margin-top:12px"></div></section>
    <div id="why-wrap" hidden><section class="card leak-card"><form id="why-form"><fieldset class="optgroup"><legend class="qrow"><span>${W.question}</span><span id="why-chip"></span></legend></fieldset>
      <div class="actions" style="margin-top:12px" id="why-actions"></div></form><div id="why-feedback" style="margin-top:12px"></div></section></div>
    <div id="leak-takeaway"></div>
  </div>`;
  const Y = R.why, wf = $('#why-form');
  const need = W.options.filter(o => o.correct).map(o => o.id);
  const drawWhy = () => {
    $('#why-wrap').hidden = !R.leakDone;
    $('fieldset', wf).innerHTML = `<legend class="qrow"><span>${W.question}</span><span id="why-chip"></span></legend>` + checksHTML('why', W.options, Y.picks, Y.right, Y.wrong, Y.done);
    const missing = need.filter(id => !Y.right.includes(id)).length;
    $('#why-chip').innerHTML = Y.done ? `<span class="chip done">${icon('i-check')} All ${need.length} reasons found</span>` : `<span class="chip" role="status">${need.length - missing} of ${need.length} reasons found</span>`;
    $('#why-actions').innerHTML = Y.done ? '' : `<button type="submit" class="btn primary" aria-disabled="${Y.picks.some(id => !Y.right.includes(id)) ? 'false' : 'true'}">${Y.checks ? 'Check again' : 'Check answers'}</button>`;
    $('#why-feedback').innerHTML = Y.done ? '' : (Y.checks ? `<div class="alert bad" role="status">${icon('i-x')}<div>${missing===1?'One reason is':missing+' reasons are'} still missing. Select ${missing===1?'it':'them'} from the options that are still open, then check again!</div></div>` : '');
    $('#leak-takeaway').innerHTML = Y.done ? `<section class="takeaway"><h3>${L.takeawayTitle}</h3><p>${L.takeaway}</p></section>` : '';
  };
  wf.addEventListener('change', e => { if (e.target.name !== 'why') return; const id = e.target.value; if (e.target.checked) { if (!Y.picks.includes(id)) Y.picks.push(id); } else Y.picks = Y.picks.filter(x => x !== id); drawWhy(); });
  wf.addEventListener('submit', e => { e.preventDefault(); if (Y.done) return; const fresh = Y.picks.filter(id => !Y.right.includes(id)); if (!fresh.length) return;
    fresh.forEach(id => { if (W.options.find(o => o.id === id).correct) Y.right.push(id); else Y.wrong.push(id); });
    Y.picks = Y.right.slice(); Y.checks++; Y.done = need.every(id => Y.right.includes(id)); drawWhy(); renderFooter(); });
  const redraw = () => { $('#funnel').innerHTML = L.stages.map((s,i)=>tile(s,i)+(i<L.stages.length-1?'<span class="arrow" aria-hidden="true">&rarr;</span>':'')).join(''); wire(); };
  const drawFeedback = () => {
    if (R.leakDone) {
      $('#leak-feedback').innerHTML = `<div class="alert ok" role="status">${icon('i-check')}<div>${L.correct}</div></div>`;
    } else if (R.leakWrong.length) {
      const last = L.stages.find(s => s.id === R.leakWrong[R.leakWrong.length-1]);
      $('#leak-feedback').innerHTML = `<div class="alert bad" role="status">${icon('i-x')}<div><b>Not quite.</b> ${last.why} Select another option.</div></div>`;
    } else $('#leak-feedback').innerHTML = '';
    drawWhy();
  };
  /* Graded on click, like the option cards. */
  function wire(){ $$('#funnel button.st').forEach(b => b.addEventListener('click', () => { if (R.leakDone) return; const s = L.stages.find(x => x.id === b.dataset.id);
    if (!s.correct) { R.leakWrong.push(s.id); R.leak = null; redraw(); drawFeedback(); return; }
    R.leak = s.id; R.leakDone = true; redraw(); drawFeedback(); renderFooter(); })); }
  wire(); drawFeedback();
}

function renderFix(round, bar){

  const cfg = round===1 ? METER1 : METER2;
  main.innerHTML = `<div class="col">${bar}

    <details class="study"><summary>Study details</summary><div class="body">${round===1?STUDY1:STUDY2}</div></details>

      <div class="runbody"><div><div class="tried"><h4>Estimates for each strategy</h4><div id="tried-rows"></div><p class="cap" id="tried-cap"><i></i>True value</p></div></div>
