<title>Run the Survey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap">
<style>
/* Layout: C4R monolith activity shell. Sticky header, fixed footer, one lg (1024) column, light theme only (the activity format is light). */
:root{
  --text:#202020; --muted:#757575; --rule:#E0E0E0; --card-border:rgba(0,0,0,.15); --page:#ffffff; --panel:#F7F7F8;
  --purple:#6F00FF; --purple-tint:#f3e8ff; --purple-hover:#F3EBFF;
  --green:#0AA000; --green-text:#2e7d32; --green-tint:#e8f5e9;
  --red:#d00000; --red-tint:#ffebeb;
  --amber:#ff9800; --amber-text:#A16000; --amber-tint:#fff3e0;
  --info:#0082FF; --info-tint:#e0f2fe;
  --takeaway:#1859D7; --takeaway-tint:#e3ebfa;
  --grey-tone:#e7e6e6; --grey-tone-border:#333132;
  --mid-gray:#999999; --option-border:#7F7F7F;
  --unit:#0082FF; --unit-tint:#e0f0ff; --instr-tint:#eee0ff;
  --font:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --fs-xs:.75rem; --fs-sm:.875rem; --fs-md:1rem; --fs-lg:1.2rem; --fs-xl:1.4rem;
  --h1:1.5rem; --h2:1.375rem; --h3:1.25rem; --h4:1.125rem;
  --header-h:52px; --footer-h:81px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:var(--fs-md);line-height:1.5;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:var(--h1);font-weight:800}
h2{font-size:var(--h2);font-weight:700}
h3{font-size:var(--h3);font-weight:700}
h4{font-size:var(--h4);font-weight:700}
p{margin:0}
ul,ol{margin:0;padding-left:1.4em}
button{font-family:inherit;font-size:var(--fs-md);cursor:pointer}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:var(--purple)}

/* Chrome */
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--header-h);background:var(--page);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--page)}
.header .logo{width:32px;height:32px;flex:none}
.header h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header .proto{font-size:var(--fs-xs);color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:2px 10px;white-space:nowrap}
.footer{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--footer-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--page);border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.footer[hidden]{display:none}
.footer .inner{width:100%;max-width:1024px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.gate-msg{position:absolute;right:0;bottom:calc(100% + 6px);background:var(--text);color:#fff;font-size:var(--fs-sm);padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.gate-msg.show{opacity:1}
@media (max-width:640px){.gate-msg{white-space:normal;max-width:70vw;text-align:right}}

/* Buttons (StyledButton) */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:10px 20px;font-weight:400;border:2px solid transparent;line-height:1.2;min-height:44px}
.btn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn.primary:hover{background:#5700CA;border-color:#5700CA}
.btn.secondary{background:#fff;color:var(--purple);border-color:var(--purple)}
.btn.secondary:hover{background:var(--purple-hover)}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.primary[aria-disabled="true"]:hover{background:var(--purple);border-color:var(--purple)}
.btn svg{width:20px;height:20px;flex:none}

/* Page */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(var(--footer-h) + 28px)}
main.no-footer{padding-bottom:40px}
.col{max-width:1024px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.col.md{max-width:768px}
.col.congrats{max-width:600px}

/* Progress bar */
.progress{display:flex;flex-direction:column;gap:6px}
.progress .blocks{display:flex;gap:4px}
.progress .blocks span{flex:1;height:8px;border-radius:2px;background:var(--rule)}
.progress .blocks span.done{background:var(--purple)}
.progress .labels{display:flex;justify-content:space-between;font-size:var(--fs-sm);color:var(--muted);gap:12px}
.progress .labels b{font-weight:600;color:var(--text)}

/* Cards and panels */
.card{background:#fff;border:1px solid var(--card-border);border-radius:12px;padding:16px 20px}
.icard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;background:var(--instr-tint)}
.icard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--purple)}
.icard .claim{font-size:var(--fs-sm);color:var(--muted);border-top:1px solid rgba(111,0,255,.25);padding-top:8px;margin-top:4px}
.precontext h3{margin-bottom:6px}
.icard .claim b{color:var(--text);font-weight:600}
details.study{border:1px solid var(--card-border);border-radius:12px;background:#fff}
details.study summary{cursor:pointer;padding:12px 20px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.study summary::-webkit-details-marker{display:none}
details.study summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--text);border-bottom:2px solid var(--text);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.study[open] summary::before{transform:rotate(45deg)}
details.study .body{padding:0 20px 16px;display:flex;flex-direction:column;gap:8px;font-size:var(--fs-md)}
details.study .body ul li{margin-bottom:2px}
details.study .cite{font-size:var(--fs-sm);color:var(--muted)}
.tone{border-radius:12px;padding:14px 18px;border:1px solid}
.tone.green{background:var(--green-tint);border-color:var(--green-text)}
.tone.amber{background:var(--amber-tint);border-color:var(--amber)}
.tone.grey{background:var(--grey-tone);border-color:var(--grey-tone-border)}
.tone.purple{background:#eee0ff;border-color:var(--purple)}
.tone.info{background:var(--info-tint);border-color:var(--info)}
.tone .phrase{font-weight:600}
.tone.green .phrase{color:var(--green-text)}
.tone.amber .phrase{color:var(--amber-text)}
.tone.grey .phrase{color:var(--grey-tone-border)}
.tone.purple .phrase{color:var(--purple)}
.tone .again{display:block;margin-top:6px;font-size:var(--fs-sm)}
.takeaway{background:var(--takeaway-tint);border-radius:12px;padding:16px 20px;position:relative;overflow:hidden}
.takeaway::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--takeaway)}
.takeaway h3{margin-bottom:6px}
.unit{background:var(--unit-tint);border-radius:12px;padding:20px 24px;position:relative;overflow:hidden}
.unit::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--unit)}
.unit h2{margin-bottom:8px}
.intro-panel h3{margin-bottom:8px}
.intro-panel ol li{margin-bottom:4px}

/* Options (ExplainedOption) */
.optgroup{display:flex;flex-direction:column;gap:10px}
.optgroup legend{font-weight:600;margin-bottom:6px;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.opt{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;border:2px solid var(--option-border);border-radius:9px;padding:12px 16px;background:#fff;cursor:pointer;position:relative}
.opt:hover{background:var(--purple-hover)}
.opt input{margin:4px 0 0;width:18px;height:18px;flex:none;accent-color:var(--purple)}
.opt .label{flex:1;min-width:0}
.opt .label small{display:block;color:var(--muted);font-size:var(--fs-sm);font-weight:300;margin-top:2px}
.opt.selected{border-color:var(--purple);background:var(--purple-tint)}
.opt.correct{border-color:var(--green);background:var(--green-tint)}
.opt.incorrect{border-color:var(--red);background:var(--red-tint)}
.opt.readonly{cursor:default}
.opt.readonly:hover{background:inherit}
.opt.readonly.correct:hover{background:var(--green-tint)}
.opt.readonly.incorrect:hover{background:var(--red-tint)}
.opt.readonly.selected:hover{background:var(--purple-tint)}
.opt.knocked{cursor:default;border-color:var(--red);background:var(--red-tint)}
.opt.knocked:hover{background:var(--red-tint)}
.opt.knocked input{accent-color:var(--red)}
.opt.knocked .mark{color:var(--red)}
.opt .mark{width:24px;height:24px;flex:none;margin-top:1px}
/* ExplainedOption: the explanation reveals inside the card, indented under the label, above a thin rule. */
.opt .expl{flex-basis:100%;display:block;margin-left:30px;margin-top:-4px;font-size:var(--fs-md);color:var(--text);cursor:default}
.opt.knocked .expl{color:var(--text)}
.opt .expl .phrase{font-weight:600}
.opt .expl .phrase.green{color:var(--green-text)} .opt .expl .phrase.amber{color:var(--amber-text)} .opt .expl .phrase.grey{color:var(--grey-tone-border)}
.opt .expl .ev{display:block;margin-top:6px;font-size:var(--fs-sm)}
.opt .expl .verdict{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-weight:600}
.opt .expl .verdict svg{width:22px;height:22px;flex:none}
.opt .expl .verdict.ok{color:var(--green-text)} .opt .expl .verdict.bad{color:var(--red)}
.opt .mark.muted{color:#767676}
.opt.correct .mark{color:var(--green)}
.opt.incorrect .mark{color:var(--red)}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 16px;border:1px solid}
.alert svg{width:24px;height:24px;flex:none}
.alert.ok{background:var(--green-tint);border-color:var(--green-text)} .alert.ok svg{color:var(--green)}
.alert.bad{background:var(--red-tint);border-color:var(--red)} .alert.bad svg{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);border:1px solid var(--option-border);border-radius:999px;padding:3px 12px;align-self:flex-end;background:#fff}
.chip.done{border-color:var(--green-text);background:var(--green-tint);color:var(--green-text)}
.chip svg{width:16px;height:16px}

/* Face key, inside a collapsible drawer under the flock strip */
details.legend{margin-top:10px;border-top:1px solid var(--rule);padding-top:8px}
details.legend summary{cursor:pointer;font-weight:600;font-size:var(--fs-sm);list-style:none;display:flex;align-items:center;gap:8px;padding:4px 0}
details.legend summary::-webkit-details-marker{display:none}
details.legend summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--text);border-bottom:2px solid var(--text);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-left:2px}
details.legend[open] summary::before{transform:rotate(45deg)}
.key{padding-top:8px}
.key ol{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.key li{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:var(--fs-xs);line-height:1.25}
.key li svg{width:36px;height:36px;overflow:visible}
.key li b{font-weight:600;font-size:var(--fs-sm)}
.key .scale{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted);margin-top:8px;border-top:1px solid var(--rule);padding-top:6px}
@media (max-width:420px){.key ol{gap:4px}.key li svg{width:30px;height:30px}}

/* Flock strip: all 40 heads in one horizontal line at the top of the page. Sticks under the header on wide screens so it stays in view while the study runs. */
.strip{padding:12px 20px}
.strip .top{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:8px}
.strip .top h3{font-size:var(--h4)}
.strip .top .sub{font-size:var(--fs-sm);color:var(--muted)}
.flock{display:grid;grid-template-columns:repeat(40,minmax(0,1fr));gap:3px}
@media (max-width:899px){.flock{grid-template-columns:repeat(20,minmax(0,1fr))}}
@media (max-width:559px){.flock{grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}}
.head{width:100%;aspect-ratio:1;max-width:100%;transition:opacity .5s,filter .5s;display:block;overflow:visible}
.head.out{opacity:.2;filter:grayscale(1)}
.flock-panel h3{margin-bottom:4px}
.flock-panel .sub{font-size:var(--fs-sm);color:var(--muted);margin-bottom:4px}
.flock-panel .sub:empty{display:none}
.flock.sample{display:flex;flex-wrap:wrap;gap:4px;min-height:32px;align-content:flex-start}
.flock.sample .head{width:28px;height:28px}
.head.in-sample{animation:pop .45s ease-out both}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.empty{color:var(--muted);font-size:var(--fs-sm);grid-column:1/-1;padding:16px 0;text-align:center}
.weeks{margin:0 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.weeks .now{font-size:var(--h3);font-weight:700;min-height:1.3em}
.weeks ol{list-style:none;padding:0;margin:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.weeks li{border:1px solid var(--rule);border-radius:8px;padding:4px 10px;font-size:var(--fs-sm);color:var(--muted);min-width:56px;text-align:center}
.weeks li.done{border-color:var(--purple);background:var(--purple-tint);color:var(--text)}
.weeks li.now-wk{border-color:var(--purple);background:var(--purple);color:#fff;font-weight:600}
.flock-panel .status{font-size:var(--h3);font-weight:700;min-height:1.3em;margin-bottom:2px}
.flock-panel .pct{font-size:var(--h4);font-weight:600;color:var(--purple);min-height:1.3em;margin-bottom:0}

.flock-panel .pct:empty{display:none}
.flock-panel .status:empty{display:none}
.runrow{display:flex;justify-content:flex-start;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 8px}
.weeks{align-items:flex-start}
.weeks ol{justify-content:flex-start}

/* Run and result cards: two halves that wrap to one column when narrow. A hidden half takes no space. */
.runbody{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-start}
.runbody > div{flex:1 1 300px;min-width:0}
.runbody .meter{margin-top:0;border-top:0;padding-top:0}
.runbody h3{margin-bottom:6px}
.titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:8px}
.titlerow h3{margin:0;padding-top:8px}
.rungrp{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-left:auto}
.rungrp .sub{margin:0;text-align:right}
.statrow{display:flex;align-items:baseline;gap:4px 16px;flex-wrap:wrap;margin-top:8px}
.statrow .status,.statrow .pct{margin:0}

.card.flock-panel{padding-top:10px}
.runbody .status{margin-top:2px}
/* Remedy chooser: one row of pills directly above the result card, so a selection and its effect sit together. */
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chiprow{display:flex;justify-content:flex-end;margin-top:-6px}
.pill{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--option-border);border-radius:999px;padding:8px 16px;background:#fff;color:var(--text);font:inherit;line-height:1.2;min-height:44px;text-align:left}
.pill:hover{background:var(--purple-hover)}
.pill[aria-pressed="true"]{border-color:var(--purple);background:var(--purple-tint);font-weight:600}
.pill svg{width:18px;height:18px;flex:none}
.pill .ok{color:var(--green)} .pill .bad{color:var(--red)}
.fix-fb .alert .sub{color:var(--muted);font-size:var(--fs-sm)}
.fix-fb .alert .ev{display:block;margin-top:6px;font-size:var(--fs-sm)}
.fix-fb .alert .phrase{font-weight:600}
.fix-fb .alert .phrase.green{color:var(--green-text)} .fix-fb .alert .phrase.amber{color:var(--amber-text)} .fix-fb .alert .phrase.grey{color:var(--grey-tone-border)}
.fix-fb .alert .verdict{display:block;margin-top:6px;font-weight:600}
/* Estimates so far (fix page): one thin bar per remedy tried, dashed line at the true value. */
.tried{margin-top:0}
.tried h4{font-size:var(--fs-md);margin-bottom:2px}
.tried .trow{display:grid;grid-template-columns:minmax(90px,30%) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:var(--fs-sm);padding:2px 0}
.tried .trow .tl{color:var(--muted);line-height:1.25}
.tried .trow.cur .tl,.tried .trow.cur .tv{color:var(--purple);font-weight:600}
.tried .tb{position:relative;height:10px;background:var(--panel);border:1px solid var(--rule);border-radius:5px}
.tried .tb i{position:absolute;left:0;top:0;bottom:0;background:var(--mid-gray);border-radius:0 4px 4px 0;transition:width .6s}
.tried .trow.cur .tb i{background:var(--purple)}
.tried .tb em{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--takeaway);transform:translateX(-50%)}
.tried .tv{font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.tried .trow.untried .tv{color:var(--muted);font-weight:300;font-size:var(--fs-xs)}
.tried .trow.untried .tb{border-style:dashed}
.tried .cap{font-size:var(--fs-xs);color:var(--muted);margin-top:4px}
.tried .cap i{display:inline-block;width:12px;border-top:2px dashed var(--takeaway);vertical-align:middle;margin-right:4px}
.head.new{animation:pop .45s ease-out both}

/* Meter (nested inside a card) */
.meter{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
.meter .mtitle{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.meter .mtitle h4{margin:0}
.tip{position:relative;display:inline-flex}
.tip > button{all:unset;cursor:help;width:24px;height:24px;border-radius:50%;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.tip > button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.tip > button svg{width:22px;height:22px}
.tip .bubble{position:absolute;left:0;bottom:calc(100% + 8px);background:#202020;color:#fff;font-size:var(--fs-sm);font-weight:300;line-height:1.4;padding:8px 10px;border-radius:8px;width:min(340px,80vw);z-index:6;display:none;outline:1px solid #fff}
.tip .bubble::after{content:"";position:absolute;left:8px;top:100%;border:7px solid transparent;border-top-color:#202020}
.tip:hover .bubble,.tip:focus-within .bubble{display:block}
.meter .track{position:relative;height:14px;background:var(--panel);border:1px solid var(--rule);border-radius:7px;margin:30px 10px 28px}
.meter .gap{position:absolute;top:0;bottom:0;background:var(--amber-tint);border-left:1px dashed var(--amber-text);border-right:1px dashed var(--amber-text);transition:left .6s,width .6s}
.meter .pin{position:absolute;top:50%;width:4px;height:30px;border-radius:2px;transform:translate(-50%,-50%);transition:left .6s}
.meter .pin.truth{background:var(--takeaway)}
.meter .pin.est{background:var(--purple)}
.meter .tag{position:absolute;transform:translateX(-50%);font-size:var(--fs-xs);white-space:nowrap;transition:left .6s;font-weight:600}
.meter .tag.truth{top:-32px;color:var(--takeaway)}
.meter .tag.est{top:18px;color:var(--purple);border:2px solid var(--purple);border-radius:6px;padding:1px 6px;background:#fff}
.meter .basepin{position:absolute;top:50%;width:0;height:30px;border-left:2px dashed var(--mid-gray);transform:translate(-50%,-50%);transition:left .6s}
.meter .tag.base{top:-32px;color:var(--muted);font-weight:400}
.meter .ticks{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted);margin:0 10px}
.meter .readout{display:flex;gap:4px 20px;flex-wrap:wrap;margin-top:4px;font-size:var(--fs-sm)}
.meter .readout b{font-weight:600}
.meter .readout .gapval{color:var(--amber-text)}
.meter button.pinbtn{all:unset;position:absolute;top:50%;width:4px;height:30px;border-radius:2px;transform:translate(-50%,-50%);cursor:help;transition:left .6s}
.meter button.pinbtn:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.meter button.pinbtn.truth{background:var(--takeaway)} .meter button.pinbtn.est{background:var(--purple)}
.head.hi{outline:2px solid var(--takeaway);outline-offset:1px;border-radius:30%}
.head.hi2{outline:2px solid var(--purple);outline-offset:1px;border-radius:30%}
.flock.sample .head.hi2{outline-width:3px}

.funnel .st{flex:1;min-width:120px;border:1px solid var(--rule);border-radius:10px;padding:8px 12px;background:#fff;display:flex;flex-direction:column;gap:0}
.funnel .st .n{font-size:var(--h3);font-weight:700;line-height:1.2}
.funnel .st .lbl{font-size:var(--fs-sm);line-height:1.3}
.funnel .st .note{font-size:var(--fs-xs);color:var(--muted);line-height:1.3}
.funnel .arrow{align-self:center;color:var(--muted);font-size:var(--fs-lg)}
.funnel .st.leak{border-color:var(--purple);border-style:dashed;background:var(--purple-tint)}
.funnel .st.result{background:var(--amber-tint);border-color:var(--amber)}
.funnel button.st{font:inherit;color:inherit;text-align:left;cursor:pointer;position:relative;padding-right:34px}
.funnel button.st:hover{background:var(--purple-hover)}
.funnel button.st.selected{border-color:var(--purple);background:var(--purple-tint)}
.funnel button.st.correct{border-color:var(--green);background:var(--green-tint);cursor:default}
.funnel button.st.knocked{cursor:default;color:var(--muted)}
.funnel button.st.knocked:hover{background:#fff}
.funnel button.st .mark{position:absolute;right:8px;top:8px;width:22px;height:22px}
.funnel button.st.correct .mark{color:var(--green)}
.funnel button.st.knocked .mark{color:#767676}
.funnel button.st .pick{font-size:var(--fs-xs);color:var(--purple);margin-top:4px;font-weight:600}
.funnel .st.leak{border-color:var(--green);border-style:solid;background:var(--green-tint)}
.funnel .st.result .n{color:var(--amber-text)}
.funnel .st.result .n small{font-size:var(--fs-sm);font-weight:400;color:var(--text)}
.leak-card h3{font-size:var(--h4)}

/* Takeaways page */
.recap-wrap h3{margin-bottom:12px}
.recaps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

.recap{border:1px solid var(--card-border);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column;gap:10px;padding:0 16px 16px;min-width:0}
.recap .band{height:6px;background:var(--purple);margin:0 -16px 4px}
.recap h4{margin:0}
.recap .bias{font-weight:600;color:var(--purple);margin-top:-6px}
.recap .funnel{margin-top:0}
.recap .funnel .st{min-width:96px;padding:6px 8px}
.recap .funnel .st .n{font-size:var(--h4)}
.recap .funnel .st .lbl{font-size:var(--fs-xs)}
.recap .tried{margin-top:2px}
.recap p{font-size:var(--fs-sm)}
.cmp-wrap{overflow-x:auto;margin-top:10px}
.cmp{width:100%;border-collapse:collapse;font-size:var(--fs-sm);min-width:520px}
.cmp th,.cmp td{border:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
.cmp th{font-weight:600;background:var(--panel)}
.cmp thead th{background:var(--purple-tint);color:var(--purple)}
.tk{background:var(--takeaway-tint);border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.tk .band{margin:0;padding:12px 16px;background:var(--takeaway);color:#fff;font-size:var(--h3);font-weight:700;line-height:1.3}
.tk .body{padding:16px;display:flow-root}
.tk .raven{float:right;width:110px;height:98px;margin:-10px -6px 8px 16px;overflow:visible}
.tk .body p+p{margin-top:12px}

/* Congrats */
.ravens{display:flex;justify-content:center;gap:20px;margin:4px 0}
.ravens svg{width:80px;height:80px;overflow:visible}
.congrats-card{background:var(--unit-tint);border-radius:12px;padding:0 0 20px;position:relative;overflow:hidden;text-align:center}
.congrats-card .band{height:10px;background:var(--unit)}
.congrats-card h2{padding:20px 24px 12px}
.congrats-card .msg{padding:0 24px;text-align:left;display:flex;flex-direction:column;gap:10px}
.congrats .actions{justify-content:center}

function wireMeter(cfg, round, sampleSel='#sample .head'){

function setMeter(cfg, est){
  const pct = v => ((v - cfg.min) / (cfg.max - cfg.min)) * 100;
  $('#m-truth').style.left = pct(cfg.truth) + '%'; $('#m-truth-tag').style.left = pct(cfg.truth) + '%';
  const e = $('#m-est'), t = $('#m-est-tag');

  $('#m-est-read').innerHTML = `Estimate <b>${cfg.fmt(est)}</b>`;
  $('#m-gap-read').innerHTML = `Gap <b class="gapval">${cfg.fmtGap(est - cfg.truth)}</b>`;

/* Faint dashed marker for the no-remedy estimate, so a remedy's movement has a reference point. */
function setBasePin(cfg, est){ const pct = v => ((v - cfg.min) / (cfg.max - cfg.min)) * 100; const b = $('#m-base'), t = $('#m-base-tag'); b.hidden = false; t.hidden = false; b.style.left = pct(est)+'%'; t.style.left = pct(est)+'%'; t.textContent = 'No remedy: ' + cfg.fmt(est); }
const METER1 = { title:'Share in poorer health', min:0, max:.5, truth:R1_TRUTH, ticks:['0%','10%','20%','30%','40%','50%'], estLabel:'Cohort\'s estimate', fmt:v=>Math.round(v*100)+'%', fmtGap:v=>(v>=0?'+':'')+Math.round(v*100)+' points',

/* `knocked` lists option ids already tried and ruled out: mid grey, locked, stated in text. */
/* `expl(o)` returns the explanation to reveal inside that option's card (ExplainedOption pattern), or '' for none.
   `markOf(o)` can supply a mark for an option that is neither graded nor knocked (used for remedies already tried). */
function optionsHTML(name, opts, chosen, done, graded, knocked=[], expl=null, markOf=null){
  return opts.map(o => {
    let cls = 'opt'; const sel = chosen === o.id; const ko = knocked.includes(o.id);
    let mark = '';
    if (ko) { cls += ' knocked'; mark = `<svg class="mark" aria-hidden="true"><use href="#i-x"/></svg><span class="vh">previously selected, incorrect</span>`; }
    else if (done) { cls += ' readonly'; if (graded) { if (sel && o.correct) cls += ' correct'; else if (sel) cls += ' incorrect'; } else if (sel) cls += ' selected'; }
    else if (sel) cls += ' selected';
    if (done && graded && sel && !ko) mark = `<svg class="mark" aria-hidden="true"><use href="#${o.correct?'i-check':'i-x'}"/></svg><span class="vh">${o.correct?'correct answer':'incorrect'}</span>`;
    else if (!mark && markOf) mark = markOf(o) || '';
    const ex = expl ? (expl(o, { sel, ko }) || '') : '';
    return `<label class="${cls}"><input type="radio" name="${name}" value="${o.id}" id="${name}-${o.id}" ${sel?'checked':''} ${(done||ko)?'disabled':''} ${ex?`aria-describedby="${name}-${o.id}-x"`:''}><span class="label">${o.text}${o.sub?`<small>${o.sub}</small>`:''}</span>${mark}${ex?`<span class="expl" id="${name}-${o.id}-x">${ex}</span>`:''}</label>`;
  }).join('');
}

/* Result card for the Fix and Judge pages: the run's numbers and the meter. The flock itself is the strip at the top of the page. On the judge page the share is a small bar chart instead of the big readout. */
function resultCardHTML(round, { chart=false } = {}){
  const cfg = round===1 ? METER1 : METER2;
  const left = chart
    ? `<div class="share" role="img" aria-labelledby="share-lbl"><span class="big" id="sample-pct">&nbsp;</span><span class="lbl" id="stage-now">&nbsp;</span><div class="bar"><i id="share-bar" style="width:0"></i></div><div class="axis"><span>0%</span><span id="share-lbl" class="vh"></span><span>100% of the people ${round===1?'invited':'enrolled'}</span></div></div><p class="sub" id="sample-sub"></p>`

/* Fix page: one bar per remedy tried, so each selection can be compared with the baseline and with earlier tries. */
function drawTried(round, R, REM){
  const cfg = round===1 ? METER1 : METER2;
  const pct = v => Math.max(0, Math.min(100, ((v - cfg.min) / (cfg.max - cfg.min)) * 100));
  const estOf = id => round===1 ? simR1(id).share : simR2(id).final.mean;
  const rows = [{ id:'base', label:'No remedy', est:estOf('base'), shown:true }].concat(REM.map(r => ({ id:r.id, label:r.short, est:estOf(r.id), shown:R.best || R.tried.includes(r.id) })));
  const cur = R.remedy || 'base';
  $('#tried-rows').innerHTML = rows.map(r => `<div class="trow ${r.id===cur?'cur':''} ${r.shown?'':'untried'}"><span class="tl">${r.label}</span><span class="tb" aria-hidden="true">${r.shown?`<i style="width:${pct(r.est)}%"></i>`:''}<em style="left:${pct(cfg.truth)}%"></em></span><span class="tv">${r.shown?cfg.fmt(r.est):'Not tried'}</span></div>`).join('');
  $('#tried-cap').innerHTML = `<i></i>True value.${R.best?' All five remedies shown.':' Find the best remedy to reveal the ones you did not try.'}`;
}
/* Apply a remedy key or a scenario rate array: dim the strip heads not in the sample, outline the ones a remedy brought in, and move the meter. */
function applyToPanel(round, which, { markNew=false } = {}){
  const cfg = round===1 ? METER1 : METER2;
  let ids, est, status, pct, sub, n = 40, share;
  if (round===1) { const r = simR1(which); ids = r.enrolled; est = ids.length ? r.share : null; status = `${ids.length} of 40 signed up`; pct = `${Math.round(ids.length/40*100)}% of the people invited`; sub = `${40-ids.length} never replied`; }
  else { const r = simR2(which); ids = r.final.ids; est = ids.length ? r.final.mean : null; n = r.invited ? 20 : 40; status = `${ids.length} of ${n} still answering in week 6`; pct = `${Math.round(ids.length/n*100)}% of the people ${r.invited?'prompted':'enrolled'}`; sub = `${n-ids.length} ${r.invited?'prompted ':''}people had stopped`; }
  share = Math.round(ids.length/n*100);
  const baseIds = new Set(markNew ? (round===1 ? simR1('base').enrolled : simR2('base').final.ids) : []);
  let added = 0;
  $$('#pop .head').forEach(h => h.classList.remove('new')); void document.body.offsetWidth;
  $$('#pop .head').forEach((h,i) => { if (!reduced) h.style.transitionDelay = (i*20)+'ms'; const inS = ids.includes(h.dataset.id); const isNew = markNew && inS && !baseIds.has(h.dataset.id); if (isNew) added++; h.classList.toggle('out', !inS); h.classList.toggle('in-s', inS); h.classList.toggle('new', isNew); });
  if (markNew && added) sub += `, ${added} ${added===1?'person':'people'} brought in by this remedy.`;
  const bar = $('#share-bar');
  if (bar) { bar.style.width = share + '%'; $('#sample-pct').textContent = share + '%'; $('#stage-now').textContent = status; $('#share-lbl').textContent = `${status}, ${share}% of the people ${round===1?'invited':'enrolled'}`; }
  else { $('#stage-now').textContent = status; $('#sample-pct').textContent = pct; }
  $('#sample-sub').textContent = sub;
  setMeter(cfg, est);
  live(`${status}. ${est==null?'No estimate.':'Estimate '+cfg.fmt(est)+', true value '+cfg.fmt(cfg.truth)+'.'}`);
}

/* Animated run. */
let runToken = 0;
const WEEK_MS = 1500;
function runSim(round, remedy, { instant=false, onDone } = {}){
  const token = ++runToken;
  const quick = instant || reduced;
  const cfg = round===1 ? METER1 : METER2;
  const sample = $('#sample'), btn = $('#run-btn');
  if (btn) btn.setAttribute('aria-disabled','true');
  const stagger = quick ? 0 : 60;
  const showSample = (ids) => {
    sample.innerHTML = ids.length ? ids.map((id,i) => head(gOf(id).face, quick?'':'in-sample', gOf(id).label).replace('<svg', `<svg style="animation-delay:${i*stagger}ms"`)).join('') : '<p class="empty">Nobody</p>';
    $$('#pop .head').forEach((h,i) => { const inS = ids.includes(h.dataset.id); if (!quick) h.style.transitionDelay = (i*25)+'ms'; h.classList.toggle('out', !inS); });
  };
  const finish = () => { if (btn) { btn.setAttribute('aria-disabled','false'); btn.innerHTML = `${icon('i-redo')} Run again`; } if (onDone) onDone(); };
  if (round === 1) {
    const res = simR1(remedy);
    const s0 = () => { if (token!==runToken) return; $('#stage-now').textContent = 'Invitations in the mail'; $('#sample-pct').textContent = ''; $$('#pop .head').forEach(h=>h.classList.remove('out')); sample.innerHTML = '<p class="empty">Waiting for replies</p>'; $('#sample-sub').textContent = 'All 40 invited'; };
    const s1 = () => { if (token!==runToken) return; $('#stage-now').textContent = `${res.enrolled.length} of 40 signed up`; $('#sample-pct').textContent = `${Math.round(res.enrolled.length/40*100)}% of the people invited`; showSample(res.enrolled); $('#sample-sub').textContent = `${40-res.enrolled.length} never replied`; setMeter(cfg, res.share); live(`${res.enrolled.length} of 40 signed up, ${Math.round(res.enrolled.length/40*100)} percent. Estimate ${cfg.fmt(res.share)}, true value ${cfg.fmt(cfg.truth)}.`); finish(); };
    if (quick) { s0(); s1(); } else { s0(); setTimeout(s1, 1400); }
    return res;
  } else {
    const res = simR2(remedy);
    const step = (w) => {
      if (token!==runToken) return;
      const wk = res.weeks[w-1];
      showSample(wk.ids);
      if (res.invited) $$('#pop .head').forEach(h => { if (!res.invited.has(h.dataset.id)) h.classList.add('out'); });
      for (let k=1;k<=6;k++){ const li=$('#wk-'+k); li.classList.toggle('done', k<w); li.classList.toggle('now-wk', k===w); }
      $('#week-now').textContent = `Week ${w} of 6`;
      $('#sample-pct').textContent = `${wk.ids.length} of ${res.invited?20:40} answered (${Math.round(wk.ids.length/(res.invited?20:40)*100)}%)`;
      $('#sample-sub').textContent = `${(res.invited?20:40)-wk.ids.length} ${res.invited?'prompted ':''}people did not answer this week`;
      setMeter(cfg, wk.mean);
      if (w<6) setTimeout(()=>step(w+1), WEEK_MS); else { live(`Week 6: ${wk.ids.length} answered. Estimate ${cfg.fmt(wk.mean)}, true value ${cfg.fmt(cfg.truth)}.`); finish(); }
    };
    if (quick) step(6); else step(1);
    return res;
  }
}

/* ---------- Render ---------- */
const main = $('#main'), footer = $('#footer'), footerWrap = $('#footer-wrap');
function render(){
  const p = PAGES[state.page];
  window.scrollTo({ top:0, behavior:'instant' });
  main.classList.toggle('no-footer', p.kind==='congrats');
  if (p.kind === 'intro') renderIntro();
  else if (p.kind === 'congrats') renderCongrats();
  else {
    const step = state.page;
    const bar = `<div class="progress" aria-label="Progress"><div class="blocks">${Array.from({length:WORKING},(_,i)=>`<span class="${i<step?'done':''}"></span>`).join('')}</div><div class="labels"><b>${p.left}</b><span>Step ${step} of ${WORKING}</span></div></div>`;
    if (p.kind === 'predict') renderPredict(p.round, bar);
    else if (p.kind === 'leak') renderLeak(p.round, bar);
    else if (p.kind === 'judge') renderJudge(p.round, bar);
    else if (p.kind === 'takeaways') renderTakeaways(bar);
    else renderFix(p.round, bar);
  }
  renderFooter();
}

function renderIntro(){
  main.innerHTML = `<div class="col md">
    <section class="unit"><h2>Let's see who actually answers when a study asks.</h2>
      <p>A study only ever hears from the people who take part. Let's run two real studies, watch who shows up in the sample, and see what that does to the result.</p></section>
    <section class="card intro-panel"><h3>Your Goal</h3>
      <p>In this activity, your goal is to <b>spot where a sample starts to drift</b> from the people it is supposed to represent, tell <b>volunteer bias</b> from <b>non-response bias</b>, and <b>choose recruitment fixes</b> that bring the estimate back toward the truth.</p></section>
    <section class="card intro-panel"><h3>What You're About To Do</h3>
      <ol>
        <li>Predict who will sign up when UK Biobank invites nine million adults, run it, and compare what other groups would have done to the estimate.</li>
        <li>Find where the sample leaked and name the bias.</li>
        <li>Choose a recruitment fix and rerun the study until you find the one that closes most of the gap.</li>
        <li>Judge what the bias does to the conclusions a researcher can draw.</li>
        <li>Do the same for a smartphone study that asks for a weekly check-in, then compare the two leaks side by side.</li>
      </ol></section>
  </div>`;
}

function renderPredict(round, bar){
  const R = round===1 ? state.r1 : state.r2;
  const P = round===1 ? PREDICT1 : PREDICT2;
  const title = round===1 ? 'Predict who signs up' : 'Predict who keeps answering';
  const body = round===1
    ? 'UK Biobank mails an invitation to every adult aged 40 to 69 near an assessment center. Choose who you expect to sign up, then run the study and watch.'
    : 'Everyone enrolled in the smartphone study is prompted to complete a symptom check-in each week for six weeks. Choose who you expect to still be answering by week 6, then run it and watch.';
  const pre = round===2 ? `<section class="tone info precontext"><h3>Next Study to Assess</h3><p>Round 2 leaves UK Biobank behind. This is a <b>different study</b> with a different question: a remote smartphone study, where everyone has already enrolled and the question is who keeps answering. Read the study details below before you predict.</p></section>` : '';
  main.innerHTML = `<div class="col">${bar}${pre}
    <section class="card icard"><h2>${title}</h2><p>${body}</p><p class="claim"><b>Claim under test:</b> ${round===1?CLAIM1:CLAIM2}</p></section>
    <details class="study" open><summary>Study details</summary><div class="body">${round===1?STUDY1:STUDY2}</div></details>
    ${simPanelsHTML(round, round===1?'Run the study':'Run the six weeks', `<form id="predict-form"><fieldset class="optgroup"><legend>${P.question}</legend></fieldset></form>`, { meterHidden:!R.predDone })}
  </div>`;
  const SCEN = round===1 ? SCEN1 : SCEN2;
  const explain = (o, { sel, ko }) => ko ? o.why : (sel && R.predDone ? P.feedback + (R.ran ? '' : ' Now run the study and watch.') : '');
  const cfg = round===1 ? METER1 : METER2;
  setMeter(cfg, null);
  wireMeter(cfg, round); wireLegend();
  const runBtn = $('#run-btn');
  const canRun = () => R.predDone;
  const form = $('#predict-form');
  /* Graded the moment an option is chosen: the card turns green or red and its explanation opens inside it. */
  const redrawOptions = () => { $('fieldset', form).innerHTML = `<legend>${P.question}</legend>` + optionsHTML('pred', P.options, R.pred, R.predDone, true, R.predWrong, explain); };
  const drawFeedback = () => { redrawOptions(); };
  /* Comparison after the run: rerun instantly with each possibility. The gate waits until all have been seen. */
  const sf = $('#scen-form');
  const seen = (id) => { if (!R.seen.includes(id)) R.seen.push(id); };
  /* The selected possibility opens its note inside its own card, so the reading sits next to the choice. */
  const drawScen = () => { const s = SCEN.find(x => x.id === (R.scen || 'base')); const had = sf.contains(document.activeElement);
    $('fieldset', sf).innerHTML = '<legend class="vh">Possibilities</legend>' + optionsHTML('scen', SCEN.map(x=>({ id:x.id, text:x.label, note:x.note })), s.id, false, false, [], o => o.id === s.id ? o.note : '');
    if (had) { const i = $('#scen-'+s.id); if (i) i.focus({ preventScroll:true }); }
    const left = SCEN.length - R.seen.length; $('#seen-count').textContent = left ? `${left} of ${SCEN.length} still to view.` : 'All four viewed.'; };
  const showWhatIf = () => { $('#whatif').hidden = !R.ran; if (R.ran) drawScen(); };
  sf.addEventListener('change', e => { if (e.target.name !== 'scen') return; R.scen = e.target.value; seen(R.scen); const s = SCEN.find(x => x.id === R.scen); drawScen(); runSim(round, s.rates === 'base' ? 'base' : s.rates, { instant:true }); renderFooter(); });
  const setRunEnabled = (on) => runBtn.setAttribute('aria-disabled', on?'false':'true');
  setRunEnabled(canRun());
  $('#sample-sub').textContent = !R.predDone ? 'Choose a prediction first.' : 'Press run to send the study out.';
  drawFeedback(); showWhatIf();
  if (R.ran) { const s = SCEN.find(x => x.id === (R.scen || 'base')); runSim(round, s.rates === 'base' ? 'base' : s.rates, { instant:true }); }
  form.addEventListener('change', e => { if (e.target.name!=='pred' || R.predDone) return;
    const pick = e.target.value, o = P.options.find(x=>x.id===pick);
    if (!o.correct) { R.predWrong.push(pick); R.pred = null; redrawOptions(); return; }
    R.pred = pick; R.predDone = true; redrawOptions();
    $('#meter-wrap').hidden = false; setRunEnabled(true); $('#sample-sub').textContent = 'Press run to send the study out.'; renderFooter(); });
  runBtn.addEventListener('click', () => { if (runBtn.getAttribute('aria-disabled')==='true') return; R.scen = null; if (R.ran) drawScen(); runSim(round, 'base', { onDone(){ R.ran = true; seen('base'); drawFeedback(); showWhatIf(); renderFooter(); } }); });
}

function renderLeak(round, bar){
  const R = round===1 ? state.r1 : state.r2;
  const L = round===1 ? LEAK1 : LEAK2;
  const cfg = round===1 ? METER1 : METER2;
  const res = round===1 ? simR1('base') : simR2('base');
  const est = round===1 ? res.share : res.final.mean;
  const counts = round===1 ? [40, res.enrolled.length, res.enrolled.length, null] : [40, res.weeks[0].ids.length, res.final.ids.length, null];
  const tile = (s, i) => {
    const sel = R.leak === s.id, ko = R.leakWrong.includes(s.id), ok = R.leakDone && s.correct;
    const cls = 'st' + (ok?' correct':'') + (ko?' knocked':'') + (sel && !ok && !ko?' selected':'') + (i===3?' result':'');
    const n = i===3 ? `${cfg.fmt(est)} <small>vs ${cfg.fmt(cfg.truth)} true</small>` : counts[i];
    const mark = ok ? `<svg class="mark" aria-hidden="true"><use href="#i-check"/></svg><span class="vh">correct answer</span>` : ko ? `<svg class="mark" aria-hidden="true"><use href="#i-x"/></svg><span class="vh">previously selected, incorrect</span>` : '';
    const pick = (!R.leakDone && !ko) ? `<span class="pick">Select this stage</span>` : '';
    return `<button type="button" class="${cls}" data-id="${s.id}" aria-pressed="${sel?'true':'false'}" ${(R.leakDone||ko)?'disabled':''}><span class="n">${n}</span><span class="lbl">${s.lbl}</span><span class="note">${s.note}</span>${pick}${mark}</button>`;
  };
  main.innerHTML = `<div class="col">${bar}
    <section class="card icard"><h2>Find where the sample leaked</h2><p>${round===1?'The cohort came out far healthier than the people invited.':'The study\'s average symptom score ran high.'} In the flow chart, select the stage where the people in the sample stopped looking like the people the study is about.</p><p class="claim"><b>Claim under test:</b> ${round===1?CLAIM1:CLAIM2}</p></section>
    <details class="study"><summary>Study details</summary><div class="body">${round===1?STUDY1:STUDY2}</div></details>
    <section class="card leak-card"><h3 id="funnel-label">What the run showed. Where did the leak happen?</h3>
      <div class="funnel" role="group" aria-labelledby="funnel-label" id="funnel">${L.stages.map((s,i)=>tile(s,i)+(i<3?'<span class="arrow" aria-hidden="true">&rarr;</span>':'')).join('')}</div>
      <div id="leak-feedback" style="margin-top:12px"></div></section>
  </div>`;
  const redraw = () => { $('#funnel').innerHTML = L.stages.map((s,i)=>tile(s,i)+(i<3?'<span class="arrow" aria-hidden="true">&rarr;</span>':'')).join(''); wire(); };
  const drawFeedback = () => {
    if (R.leakDone) {
      $('#leak-feedback').innerHTML = `<div class="col" style="padding:0"><div class="alert ok" role="status">${icon('i-check')}<div><b>Correct.</b> ${round===1?'Everyone who signed up was assessed. The sample thinned, and skewed, at the moment people decided whether to join.':'The people who enrolled were a fair mix. The sample thinned, and skewed, as people stopped answering.'}</div></div>
        <section class="takeaway"><h3>${L.takeawayTitle}</h3><p>${L.takeaway}</p></section></div>`;
    } else if (R.leakWrong.length) {
      const last = L.stages.find(s => s.id === R.leakWrong[R.leakWrong.length-1]);
      $('#leak-feedback').innerHTML = `<div class="alert bad" role="status">${icon('i-x')}<div><b>Not quite.</b> ${last.why} Select another stage.</div></div>`;
    } else $('#leak-feedback').innerHTML = '';
  };
  /* Graded on click, like the option cards. */
  function wire(){ $$('#funnel button.st').forEach(b => b.addEventListener('click', () => { if (R.leakDone) return; const s = L.stages.find(x => x.id === b.dataset.id);
    if (!s.correct) { R.leakWrong.push(s.id); R.leak = null; redraw(); drawFeedback(); return; }
    R.leak = s.id; R.leakDone = true; redraw(); drawFeedback(); renderFooter(); })); }
  wire(); drawFeedback();
}

function renderFix(round, bar){
  const R = round===1 ? state.r1 : state.r2;
  const REM = round===1 ? REMEDIES1 : REMEDIES2;
  const cfg = round===1 ? METER1 : METER2;
  main.innerHTML = `<div class="col">${bar}
    <section class="card icard"><h2>Fix it and rerun</h2><p>Choose a recruitment remedy. The flock reruns the ${round===1?'study':'six weeks'} with it and the meter moves. Keep trying until you find the remedy that closes most of the gap.</p><p class="claim"><b>Claim under test:</b> ${round===1?CLAIM1:CLAIM2}</p></section>
    <details class="study"><summary>Study details</summary><div class="body">${round===1?STUDY1:STUDY2}</div></details>
    ${stripHTML(round)}
    <div class="pills" role="group" aria-label="Remedy" id="pills"></div>
    <div class="chiprow"><span class="chip" id="chip" role="status" aria-live="polite"></span></div>
    ${resultCardHTML(round)}
    <div class="fix-fb" id="fix-result"></div>
  </div>`;
  const chip = $('#chip'), pills = $('#pills');
  wireMeter(cfg, round, '#pop .head.in-s'); wireLegend();
  setBasePin(cfg, round===1 ? simR1('base').share : simR2('base').final.mean);
  const drawChip = () => { chip.classList.toggle('done', R.best); chip.innerHTML = (R.best ? icon('i-check') + ' Best remedy found, ' : '') + `${R.tried.length} ${R.tried.length===1?'remedy':'remedies'} tried`; };
  const drawPills = () => { pills.innerHTML = REM.map(r => `<button type="button" class="pill" data-id="${r.id}" aria-pressed="${R.remedy===r.id?'true':'false'}">${r.text}${R.tried.includes(r.id)?`<svg class="${r.best?'ok':'bad'}" aria-hidden="true"><use href="#${r.best?'i-check':'i-x'}"/></svg><span class="vh">${r.best?'best remedy':'tried, not the best'}</span>`:''}</button>`).join(''); };
  const showResult = (rem) => { $('#fix-result').innerHTML = rem ? `<div class="alert ${rem.best?'ok':'bad'}" role="status">${icon(rem.best?'i-check':'i-x')}<div><b>${rem.text}.</b> <span class="sub">${rem.sub}</span><br><span class="phrase ${rem.tone}">${rem.phrase}</span> ${rem.note}<span class="ev"><b>Evidence:</b> ${rem.evidence}</span><span class="verdict">${rem.best?FOUND:AGAIN}</span></div></div>` : ''; };
  const apply = () => { const rem = REM.find(r => r.id === R.remedy); applyToPanel(round, rem ? rem.id : 'base', { markNew:true }); if (rem) { if (!R.tried.includes(rem.id)) R.tried.push(rem.id); if (rem.best) R.best = true; } else $('#sample-sub').textContent = 'Baseline, no remedy. Choose one above.'; drawTried(round, R, REM); drawPills(); showResult(rem); drawChip(); renderFooter(); };
  apply();
  pills.addEventListener('click', e => { const b = e.target.closest('.pill'); if (!b) return; R.remedy = b.dataset.id; apply(); $(`.pill[data-id="${R.remedy}"]`).focus({ preventScroll:true }); });
}

function renderJudge(round, bar){
  const R = round===1 ? state.r1 : state.r2;
  const J = R.judge;
  const q = IMPACT[round-1];
  const cfg = round===1 ? METER1 : METER2;
  main.innerHTML = `<div class="col">${bar}
    <section class="card icard"><h2>Judge the impact on inference</h2><p>Here is what happened when the study ran with no remedy. Decide what this bias does to the conclusions a researcher can draw.</p><p class="claim"><b>Claim under test:</b> ${round===1?CLAIM1:CLAIM2}</p></section>
    <details class="study"><summary>Study details</summary><div class="body">${round===1?STUDY1:STUDY2}</div></details>
    ${stripHTML(round)}
    ${resultCardHTML(round, { chart:true })}
    <form id="judge-form"><fieldset class="optgroup"><legend>${q.question}</legend></fieldset></form>
    <div id="judge-takeaway"></div>
  </div>`;
  wireMeter(cfg, round, '#pop .head.in-s'); wireLegend();
  const jf = $('#judge-form');
  applyToPanel(round, 'base');
  const explain = (o, { sel, ko }) => ko ? o.why : (sel && J.done ? q.feedback : '');
  const redraw = () => { $('fieldset', jf).innerHTML = `<legend>${q.question}</legend>` + optionsHTML('judge', q.options, J.pick, J.done, true, J.wrong, explain); };
  const drawFeedback = () => {
    redraw(); $('#judge-takeaway').innerHTML = '';
    if (J.done) { $('#judge-takeaway').innerHTML = `<section class="takeaway"><h3>What this bias does to inference</h3><p>${round===1?'An estimate of how common something is, read straight off a volunteer sample, is wrong in the direction the volunteers lean, and a larger sample repeats the error with more precision. Comparisons between groups inside the sample can survive, but only when what drove people to volunteer is unrelated to both the exposure and the outcome being compared.':'A trend built from a shrinking, self-selected sample describes who is still answering, not how the population is changing. Before reading a change over time, check whether the people behind each time point are the same people.'}</p></section>`; }
  };
  drawFeedback();
  jf.addEventListener('change', e => { if (e.target.name!=='judge' || J.done) return; const pick = e.target.value, o = q.options.find(x => x.id === pick);
    if (!o.correct) { J.wrong.push(pick); J.pick = null; drawFeedback(); return; }
    J.pick = pick; J.done = true; drawFeedback(); renderFooter(); });
}

/* Takeaways page, after the vtr-sap-03 payoff pattern: instruction card, a panel of recap cards built from the actual runs, a side-by-side comparison, then a TakeawayPanel with the pointing raven. */
function renderTakeaways(bar){
  const b1 = simR1('base'), f1 = simR1('outreach'), b2 = simR2('base'), f2 = simR2('shorten');
  const tile = (n, lbl, note, cls='') => `<div class="st ${cls}"><span class="n">${n}</span><span class="lbl">${lbl}</span><span class="note">${note}</span></div>`;
  const arrow = '<span class="arrow" aria-hidden="true">&rarr;</span>';
  const bars = (cfg, rows) => { const pct = v => ((v - cfg.min) / (cfg.max - cfg.min)) * 100; return `<div class="tried">${rows.map(r => `<div class="trow ${r.cur?'cur':''}"><span class="tl">${r.label}</span><span class="tb" aria-hidden="true"><i style="width:${pct(r.est)}%"></i><em style="left:${pct(cfg.truth)}%"></em></span><span class="tv">${cfg.fmt(r.est)}</span></div>`).join('')}<p class="cap"><i></i>True value ${cfg.fmt(cfg.truth)}</p></div>`; };
  main.innerHTML = `<div class="col">${bar}
    <section class="card icard"><h2>Takeaways</h2><p>Two real studies, two different leaks. Here is what each run showed, side by side, and what to carry into the next study you read or design.</p></section>
    <section class="card recap-wrap"><h3>Where each study leaked</h3>
      <div class="recaps">
        <article class="recap"><div class="band"></div><h4>Round 1: UK Biobank</h4><p class="bias">Volunteer bias, at the sign-up stage</p>
          <div class="funnel">${tile(40,'Invited','everyone got a letter')}${arrow}${tile(b1.enrolled.length,'Signed up','the healthier ones came','leak')}${arrow}${tile(`${METER1.fmt(b1.share)} <small>vs ${METER1.fmt(R1_TRUTH)}</small>`,'Estimate','share in poorer health','result')}</div>
          ${bars(METER1, [{ label:'No remedy', est:b1.share }, { label:'Several routes', est:f1.share, cur:true }])}
          <p><b>Best fix:</b> use several recruitment routes. Different routes reach different people, so the cohort starts to look like the invitation list.</p>
        </article>
        <article class="recap"><div class="band"></div><h4>Round 2: Smartphone study</h4><p class="bias">Non-response bias, at the follow-up stage</p>
          <div class="funnel">${tile(40,'Enrolled','a fair mix')}${arrow}${tile(b2.final.ids.length,'Still answering in week 6','the symptomatic ones stayed','leak')}${arrow}${tile(`${METER2.fmt(b2.final.mean)} <small>vs ${METER2.fmt(R2_TRUTH)}</small>`,'Estimate','average symptom score','result')}</div>
          ${bars(METER2, [{ label:'No remedy', est:b2.final.mean }, { label:'Two questions', est:f2.final.mean, cur:true }])}
          <p><b>Best fix:</b> cut the check-in to two questions. Lower burden keeps the people with little to report answering.</p>
        </article>
      </div></section>
    <section class="card"><h3>How to tell them apart</h3>
      <div class="cmp-wrap"><table class="cmp"><thead><tr><th scope="col"></th><th scope="col">Volunteer bias</th><th scope="col">Non-response bias</th></tr></thead><tbody>
        <tr><th scope="row">Where it leaks</th><td>Between being invited and taking part</td><td>Between enrolling and answering</td></tr>
        <tr><th scope="row">Who is missing</th><td>People who never opt in. Here, the less healthy.</td><td>People who stop responding. Here, the least symptomatic.</td></tr>
        <tr><th scope="row">What it does to the estimate</th><td>Prevalence read off the cohort runs low: ${METER1.fmt(b1.share)} against a true ${METER1.fmt(R1_TRUTH)}.</td><td>The average drifts toward the people who keep answering: ${METER2.fmt(b2.final.mean)} against a true ${METER2.fmt(R2_TRUTH)}.</td></tr>
        <tr><th scope="row">How to spot it</th><td>Compare participants with the invitation list.</td><td>Compare each wave of responders with everyone enrolled.</td></tr>
        <tr><th scope="row">What moves it</th><td>Several recruitment routes, tracking who is missing, compensation used with care.</td><td>Lower burden, reminders, compensation per check-in.</td></tr>
        <tr><th scope="row">What does not</th><td>More invitations.</td><td>More participants, or prompting a random subset.</td></tr>
      </tbody></table></div></section>
    <section class="tk" aria-labelledby="tk-h"><h3 class="band" id="tk-h">Takeaway: A bigger sample does not fix a skewed one.</h3>
      <div class="body"><svg class="raven" aria-hidden="true"><use href="#raven-point-left"/></svg>
        <p>Both leaks leave a sample that differs from the population on the very thing being measured, and more of the same sample only repeats the error with more precision. Half a million UK Biobank volunteers were still about half as likely to die as the people they stood in for.</p>
        <p>Before trusting an estimate, ask two questions at two stages: who chose to take part, and who kept answering. Compare each group with the people the study is about, and fix the stage that leaked instead of enlarging the study.</p>
      </div></section>
  </div>`;
}

function renderCongrats(){
  main.innerHTML = `<div class="col congrats">
    <div class="ravens">
      <svg role="img" aria-label="A celebrating raven"><use href="#face-celebratory"/></svg>
      <svg role="img" aria-label="A raven with a party blower"><use href="#face-party-blower"/></svg>
      <svg role="img" aria-label="A raven with stars in its eyes"><use href="#face-stars"/></svg>
    </div>
    <section class="congrats-card"><div class="band"></div>
      <h2>Congratulations, you've completed the activity!</h2>
      <div class="msg">
        <p>You caught both leaks. UK Biobank invited everyone, and the people who chose to join were healthier than the people who did not. That is <b>volunteer bias</b>. The smartphone study started with a fair mix, and the people who kept answering had more symptoms than the people who stopped. That is <b>non-response bias</b>.</p>
        <p>Both leave a sample that differs from the population on the very thing being measured. A bigger sample does not fix it. Recruiting through several routes, tracking who is missing, lowering the burden, and compensating people for their time are what move the estimate, and many real studies spring both leaks at once.</p>
      </div>
    </section>
    <div class="actions">
      <button type="button" class="btn secondary" id="c-prev">${icon('i-prev')} Previous</button>
      <button type="button" class="btn secondary" id="c-restart">Restart</button>
      <button type="button" class="btn primary" id="c-menu" aria-disabled="true">Activities Menu</button>
    </div>
  </div>`;
  $('#c-prev').addEventListener('click', () => { state.page--; render(); });
  $('#c-restart').addEventListener('click', () => { state.page = 0; state.r1 = fresh(); state.r2 = fresh(); render(); });
}

/* ---------- Footer / gating ---------- */
function gate(){
  const p = PAGES[state.page];
  if (p.kind==='intro' || p.kind==='congrats' || p.kind==='takeaways') return { ok:true };
  const R = p.round===1 ? state.r1 : state.r2;
  if (p.kind==='judge') return R.judge.done ? { ok:true } : { ok:false, msg:'Judge the impact on inference to continue' };
  if (p.kind==='predict') { if (!R.predDone) return { ok:false, msg:'Choose the correct prediction to continue' }; if (!R.ran) return { ok:false, msg:'Run the study to continue' }; const SC = p.round===1 ? SCEN1 : SCEN2; if (SC.some(x => !R.seen.includes(x.id))) return { ok:false, msg:'View each possibility to continue' }; return { ok:true }; }
  if (p.kind==='leak') return R.leakDone ? { ok:true } : { ok:false, msg:'Find where the leak happened to continue' };
  if (p.kind==='fix') return R.best ? { ok:true } : { ok:false, msg:'Find the remedy that closes most of the gap to continue' };
  return { ok:true };
}
function renderFooter(){
  const p = PAGES[state.page];
  if (p.kind==='congrats') { footerWrap.hidden = true; return; }
  footerWrap.hidden = false;
  const g = gate();
  const last = state.page === PAGES.length - 2;
  footer.innerHTML = `
    ${state.page > 0 ? `<button type="button" class="btn secondary" id="prev">${icon('i-prev')} Previous</button>` : '<span></span>'}
    <span id="live" class="vh" aria-live="polite"></span>
    <span class="gate-msg" id="gate-msg">${g.msg||''}</span><button type="button" class="btn primary" id="next" aria-disabled="${g.ok?'false':'true'}" aria-describedby="gate-msg">${last?'Complete Activity':'Next'} ${icon(g.ok?'i-next':'i-next-blocked')}</button>`;
  const prev = $('#prev'), next = $('#next'), msg = $('#gate-msg');
  if (prev) prev.addEventListener('click', () => { state.page--; render(); });
  const show = () => { if (!gate().ok) msg.classList.add('show'); };
  const hide = () => msg.classList.remove('show');
  next.addEventListener('mouseenter', show); next.addEventListener('focus', show);
  next.addEventListener('mouseleave', hide); next.addEventListener('blur', hide);
  next.addEventListener('click', () => { if (!gate().ok) { show(); return; } state.page++; render(); });
}

render();
})();
</script>
