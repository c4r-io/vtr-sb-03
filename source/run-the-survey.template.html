      <div id="rankwrap"><ol class="rank" id="rank" aria-label="Your ranking"></ol></div>
      <span class="vh" id="rank-live" aria-live="polite"></span>
      <div class="hint-wrap" id="hint-wrap"><button type="button" class="hint-pill" id="hint-btn" aria-expanded="false" aria-controls="hint-card">${icon('i-bulb')} Show Hint</button></div>
      <div class="hint-card" id="hint-card" hidden><button type="button" class="hx" id="hint-close" aria-label="Close hint">${icon('i-close')}</button><div class="hh">${icon('i-bulb')} Hint:</div><p>In the Estimates for each strategy section, the closer a bar reaches the dashed true-value line, the better that strategy did. The estimate that is closest to the true value goes at the top and the furthest should be placed at the bottom.</p></div>
      <div id="rank-fb" style="margin-top:12px"></div><div class="actions" id="rank-actions"></div>
      <div class="pickbar" id="pickbar" hidden><p><b>Picked:</b> "<span id="pick-lbl"></span>". Choose its new position.</p><button type="button" class="btn" id="pick-cancel" aria-label="Cancel pick">${icon('i-close')} Cancel</button></div></section>
    <div id="fix-takeaway"></div>
  </div>`;
  const pills = $('#pills');
  fitTips(); wireLegend();
  setBasePin(cfg, round===1 ? simR1('base').share : simR2('base').final.mean);
  const drawRankGate = () => { $('#rank-card').hidden = !R.best; };
  const drawPills = () => { drawRankGate(); pills.innerHTML = REM.map(r => `<button type="button" class="pill" data-id="${r.id}" aria-pressed="${R.remedy===r.id?'true':'false'}" title="${r.text}">${r.short}${R.tried.includes(r.id)?`<svg class="${r.best?'ok':'bad'}" aria-hidden="true"><use href="#${r.best?'i-check':'i-x'}"/></svg><span class="vh">${r.best?'best strategy':'tried, not the best'}</span>`:''}</button>`).join(''); };
  /* Verdict band across the top of the result card; evidence links as a line at its foot. Both react to the pill just chosen. */
  const showResult = (rem) => { const band = $('#vband'), ev = $('#evline');
    band.hidden = !rem; ev.hidden = !(rem && rem.evidence);
    if (rem) { band.className = 'vband ' + (rem.best ? 'ok' : 'bad'); band.innerHTML = `${icon(rem.best?'i-check':'i-x')}<div><b>${rem.best?FOUND:AGAIN}</b> <span class="phrase ${rem.tone}">${rem.phrase}</span> ${rem.note}</div>`; ev.innerHTML = rem.evidence ? `<b>Based on:</b> ${rem.evidence}` : ''; } };
  let drawRank = null;   // assigned below, once the ranking panel exists
  const apply = () => { const rem = REM.find(r => r.id === R.remedy); applyToPanel(round, rem ? rem.id : 'base', { markNew:true }); if (rem) { if (!R.tried.includes(rem.id)) R.tried.push(rem.id); if (rem.best) R.best = true; } else $('#sample-sub').textContent = 'No strategy yet.'; drawTried(round, R, REM); drawPills(); showResult(rem); renderFooter(); if (drawRank) drawRank(); };
  apply();
  pills.addEventListener('click', e => { const b = e.target.closest('.pill'); if (!b) return; const first = R.tried.length === 0; R.remedy = b.dataset.id; apply(); $(`.pill[data-id="${R.remedy}"]`).focus({ preventScroll:true }); if (first) requestAnimationFrame(() => { const el = $('.fixcard'); if (el) el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); }); });

  /* Ranking: one row per remedy, top is rank 1. Drag a row to a new position, or select it and then the row whose position it should take (the keyboard and touch path); a focused row also moves one place with the arrow keys. All three run the same move. A remedy is right when its gap to the true value matches the gap at that rank in the correct order, so tied remedies may take either of their two places. Right rows lock in place after a check. */
  const K = R.rank; if (!K.ranks) K.ranks = {};
  const gap = id => Math.abs((round===1 ? simR1(id).share : simR2(id).final.mean) - cfg.truth);
  const correctGaps = REM.map(r => gap(r.id)).sort((a,b) => a-b);
  const rankOK = (id, n) => n >= 1 && n <= REM.length && Math.abs(gap(id) - correctGaps[n-1]) < 1e-9;
  const ids = REM.map(r => r.id);
  // The starting order is the first arrangement, in a fixed sequence, with no remedy already in its right place.
  if (!ids.every(id => K.ranks[id])) {
    const perms = (a) => a.length <= 1 ? [a] : a.flatMap((x, k) => perms(a.filter((_, m) => m !== k)).map(p => [x, ...p]));
    const start = perms(ids).find(p => p.every((id, k) => !rankOK(id, k+1))) || ids;
    start.forEach((id, k) => { K.ranks[id] = k+1; });
  }
  let verdicts = null;   // {id: true/false} after a check; wrong ones clear when a row moves, right ones stay locked
  let hand = null;       // the picked row (click or keyboard path)
  let dragId = null;     // the row being dragged
  const byId = id => REM.find(r => r.id === id);
  const order = () => ids.slice().sort((a,b) => K.ranks[a] - K.ranks[b]);
  const posOf = id => K.ranks[id] - 1;
  const locked = id => K.done || !!(verdicts && verdicts[id] === true);
  const estOf = r => cfg.fmt(round===1 ? simR1(r.id).share : simR2(r.id).final.mean);   // every estimate shows once the ranking opens, tried or not
  const say = (msg) => { const el = $('#rank-live'); if (el) { el.textContent = ''; setTimeout(() => { el.textContent = msg; }, 30); } };
  /* The one move every path runs: put `id` at position `to` (0-based) and shift the others. Locked rows keep their places; a move onto a locked place lands just below it. */
  const moveTo = (id, to) => {
    if (!byId(id) || locked(id)) return false;
    const ord = order(); const freePos = ord.map((_, k) => k).filter(k => !locked(ord[k]));
    const free = ord.filter(x => x !== id && !locked(x));
    const k = freePos.filter(pos => pos < to).length;
    free.splice(Math.min(k, free.length), 0, id);
    const before = ord.join();
    freePos.forEach((pos, m) => { K.ranks[free[m]] = pos + 1; });
    if (order().join() === before) return false;
    if (verdicts && !K.done) { const keep = {}; ids.forEach(x => { if (verdicts[x] === true) keep[x] = true; }); verdicts = Object.keys(keep).length ? keep : null; }
    return true;
  };
  const describe = id => `${byId(id).short} moved to position ${K.ranks[id]} of ${ids.length}.`;
  drawRank = () => {
    const list = $('#rank'); if (!list) return;
    const handR = hand ? byId(hand) : null;
    list.innerHTML = order().map((id, k) => { const r = byId(id); const v = verdicts ? verdicts[id] : null; const lk = locked(id), picked = hand === id, elig = !!(handR && !lk && !picked);
      const label = elig ? `Move ${handR.short} to position ${k+1}, the place of ${r.short}` : `${r.short}, position ${k+1} of ${ids.length}${lk?', locked':''}`;
      return `<li class="rrow ${v===true?'ok':v===false?'bad':''} ${picked?'picked':''} ${elig?'elig':''} ${lk?'locked':''} ${dragId===id?'dragging':''}" data-id="${id}" title="${r.text}" ${lk ? '' : `draggable="true" role="button" tabindex="${hand && !picked && !elig ? -1 : 0}" ${elig ? '' : `aria-pressed="${picked?'true':'false'}"`}`} aria-label="${label}"><span class="badge" aria-hidden="true">${k+1}</span>${lk?'':icon('i-drag')}<span class="rl"><b>${r.short}</b><small>${estOf(r)}</small></span>${v==null?'':`<svg class="mark" aria-hidden="true"><use href="#${v?'i-check':'i-x'}"/></svg><span class="vh">${v?'right':'wrong'}</span>`}</li>`; }).join('');
    const right = verdicts ? Object.values(verdicts).filter(Boolean).length : null;
    $('#rank-chip').innerHTML = K.done ? `<span class="chip done">${icon('i-check')} Ranking complete</span>` : (verdicts ? `<span class="chip" role="status">${right} of ${ids.length} right</span>` : '');
    $('#rank-actions').innerHTML = K.done ? '' : `<button type="button" class="btn primary" id="rank-check" aria-disabled="false">${K.checks?'Check again':'Check ranking'}</button>`;
    $('#rank-fb').innerHTML = K.done ? '' : (verdicts ? `<div class="alert bad" role="status">${icon('i-x')}<div><b>Try again!</b> Reorder the strategies that are marked as incorrect. The rows that you got correct are locked in place. Reference the estimates above to help you decide which row should be placed where, then check again.</div></div>` : '');
    $('#fix-takeaway').innerHTML = K.done ? `<section class="takeaway"><h3>Good strategies work for different studies</h3><p>The strategies presented all can impact the recruitment of participants. And several can be used simultaneously! Depending on the population and where the study is struggling to retain recruitment, different strategies may be best to prevent ${round===1?'volunteer':'non-response'} bias. ${round===1?'Here the retention occurred at sign-up, among people in poorer health, so reaching them through various routes they already trust helps the most. Compensation and a clearer invitation still helped, but mailing more letters did nothing.':'Here the retention occurred in who kept answering, and the people lost were those with little to report, so cutting the burden of each check-in helps the most. Payment and reminders still can help, but more participants does nothing.'}</p></section>` : '';
    const pb = $('#pickbar'); pb.hidden = !handR; if (handR) $('#pick-lbl').textContent = handR.short;
    if (handR) footerWrap.setAttribute('inert', ''); else footerWrap.removeAttribute('inert');
    const b = $('#rank-check'); if (b) b.addEventListener('click', () => { verdicts = {}; ids.forEach(id => { verdicts[id] = rankOK(id, K.ranks[id]); }); K.checks++; K.done = ids.every(id => verdicts[id]); hand = null; drawRank(); renderFooter(); });
  };
  const focusRow = (id) => { const el = $(`.rrow[data-id="${id}"]`); if (el && el.tabIndex === 0) el.focus({ preventScroll:true }); };
  const pick = (id) => { hand = id; drawRank(); focusRow(id); say(`Picked ${byId(id).short}. Tab to the row whose position you want and press Enter to move it there, or press Escape to cancel.`); };
  const cancelPick = () => { if (!hand) return; const id = hand; hand = null; drawRank(); focusRow(id); say('Pick canceled.'); };
  const placeHand = (to) => { const id = hand; hand = null; if (moveTo(id, to)) { drawRank(); focusRow(id); say(describe(id)); } else drawRank(); };
  const rowOf = (el) => el.closest('.rrow');
  const rw = $('#rankwrap');
  rw.addEventListener('click', e => {
    const row = rowOf(e.target); if (!row) return; const id = row.dataset.id;
    if (hand) { if (row.classList.contains('elig')) { placeHand(posOf(id)); return; } if (hand === id) { cancelPick(); return; } return; }
    if (!locked(id)) pick(id);
  });
  rw.addEventListener('keydown', e => {
    if (e.key === 'Escape') { cancelPick(); return; }
    const row = rowOf(e.target); if (!row) return; const id = row.dataset.id;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
      if (hand) { if (row.classList.contains('elig')) placeHand(posOf(id)); else if (hand === id) cancelPick(); }
      else if (!locked(id)) pick(id);
      return; }
    if (hand || locked(id)) return;
    const d = (e.key === 'ArrowUp' || e.key === 'ArrowLeft') ? -1 : (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : 0; if (!d) return;
    e.preventDefault(); const to = posOf(id) + d;
    if (to < 0 || to >= ids.length || !moveTo(id, to)) { say(`${byId(id).short} is already ${d < 0 ? 'as high' : 'as low'} as it can go.`); return; }
    drawRank(); focusRow(id); say(describe(id));
  });
  $('#pick-cancel').addEventListener('click', cancelPick);
  /* The drag half. A drag supersedes a pick silently. The source fades rather than disappearing, so the browser keeps the drag alive. A drop lands before the first row whose midpoint the pointer has not passed. */
  rw.addEventListener('dragstart', e => { const row = rowOf(e.target); if (!row || locked(row.dataset.id)) { e.preventDefault(); return; } hand = null; dragId = row.dataset.id; if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); } setTimeout(drawRank, 0); });
  const dropIndex = (e) => { const rows = $$('#rank .rrow').filter(r => r.dataset.id !== dragId); const k = rows.findIndex(r => { const b = r.getBoundingClientRect(); return e.clientY < b.top + b.height / 2; }); return k === -1 ? rows.length : k; };
  rw.addEventListener('dragover', e => { if (!dragId) return; e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'move'; const row = rowOf(e.target); $$('#rank .rrow.over').forEach(o => { if (o !== row) o.classList.remove('over'); }); if (row && row.dataset.id !== dragId && !row.classList.contains('locked')) row.classList.add('over'); });
  rw.addEventListener('dragleave', e => { const row = rowOf(e.target); if (row && !row.contains(e.relatedTarget)) row.classList.remove('over'); });
  const endDrag = () => { dragId = null; $$('#rank .rrow.over').forEach(o => o.classList.remove('over')); drawRank(); };
  rw.addEventListener('drop', e => { if (!dragId) return; e.preventDefault(); const id = dragId; const to = dropIndex(e); dragId = null; if (moveTo(id, to)) say(describe(id)); endDrag(); });
  rw.addEventListener('dragend', endDrag);
  const hb = $('#hint-btn'), hc = $('#hint-card');
  hb.addEventListener('click', () => { hc.hidden = false; $('#hint-wrap').hidden = true; hb.setAttribute('aria-expanded', 'true'); $('#hint-close').focus({ preventScroll:true }); });
  $('#hint-close').addEventListener('click', () => { hc.hidden = true; $('#hint-wrap').hidden = false; hb.setAttribute('aria-expanded', 'false'); hb.focus({ preventScroll:true }); });
}

/* Takeaways page, after the vtr-sap-03 payoff pattern: instruction card, a panel of recap cards built from the actual runs, a side-by-side comparison, then a TakeawayPanel with the pointing raven. */
function renderTakeaways(bar){
  const b1 = simR1('base'), f1 = simR1('outreach'), b2 = simR2('base'), f2 = simR2('shorten');
  const tile = (n, lbl, note, cls='') => `<div class="st ${cls}"><span class="n">${n}</span><span class="lbl">${lbl}</span><span class="note">${note}</span></div>`;
  const arrow = '<span class="arrow" aria-hidden="true">&rarr;</span>';
  const bars = (cfg, rows) => { const pct = v => ((v - cfg.min) / (cfg.max - cfg.min)) * 100; return `<div class="tried">${rows.map(r => `<div class="trow ${r.cur?'cur':''}"><span class="tl">${r.label}</span><span class="tb" aria-hidden="true"><i style="width:${pct(r.est)}%"></i><em style="left:${pct(cfg.truth)}%"></em></span><span class="tv">${cfg.fmt(r.est)}</span></div>`).join('')}<p class="cap"><i></i>True value ${cfg.fmt(cfg.truth)}</p></div>`; };
  main.innerHTML = `<div class="col">${bar}
    <section class="tk" aria-labelledby="tk-h"><h3 class="band" id="tk-h">Takeaway: A bigger sample does not fix a skewed one.</h3>
      <div class="body"><svg class="raven" aria-hidden="true"><use href="#raven-point-left"/></svg>
        <p>Both studies show how a sample can differ from the population based on who volunteers to participate in studies and who continues to respond. Being mindful of strategies to mitigate both volunteer and non-response bias can help in recruiting a sample that is more reflective of the population that is being studied.</p>
        <p>Before trusting your results, ask two questions at two stages: who chose to take part, and who kept answering. Compare each group with the people the study is about, and if you can, address the retention through mitigation strategies.</p>
      </div></section>
    <section class="card recap-wrap"><h3>Where bias entered the study</h3>
      <div class="recaps">
        <article class="recap"><div class="band"></div><h4>Study 1: UK Biobank</h4><p class="bias">Volunteer bias, at the sign-up stage</p>
          <div class="funnel">${tile(40,'Invited','Everyone got a letter')}${arrow}${tile(b1.enrolled.length,'Signed up','The healthier ones participated','leak')}${arrow}${tile(`${METER1.fmt(b1.share)} <small>vs ${METER1.fmt(R1_TRUTH)}</small>`,'Estimate','Percent in poorer health, cohort vs. true value','result')}</div>
          ${bars(METER1, [{ label:'No strategy', est:b1.share }, { label:'Several routes', est:f1.share, cur:true }])}
          <p><b>Best fix:</b> Use several recruitment routes to recruit participants. Different routes reach different people and can help diversify your sample.</p>
        </article>
        <article class="recap"><div class="band"></div><h4>Study 2: Smartphone study</h4><p class="bias">Non-response bias, at the follow-up stage</p>
          <div class="funnel">${tile(40,'Enrolled','A fair mix of participants')}${arrow}${tile(b2.final.ids.length,'Still answering in week 6','The symptomatic ones stayed','leak')}${arrow}${tile(`${METER2.fmt(b2.final.mean)} <small>vs ${METER2.fmt(R2_TRUTH)}</small>`,'Estimate','Average symptom score was higher','result')}</div>
          ${bars(METER2, [{ label:'No strategy', est:b2.final.mean }, { label:'Easier questions', est:f2.final.mean, cur:true }])}
          <p><b>Best fix:</b> By cutting the check-in to two questions, the researchers help lower the time burden, which helps retain more participants.</p>
        </article>
      </div></section>
  </div>`;
}

function renderCongrats(){
  main.innerHTML = `<div class="col congrats">
    <div class="ravens">
      <svg role="img" aria-label="A celebrating raven"><use href="#face-celebratory"/></svg>
      <svg role="img" aria-label="A raven with a party blower"><use href="#face-party-blower"/></svg>
      <svg role="img" aria-label="A raven with stars in its eyes"><use href="#face-stars"/></svg>
    </div>
    <section class="congrats-card"><div class="band"></div>
      <h2>Congratulations, you've completed the activity!</h2>
      <div class="msg">
        <p>You saw two instances where volunteer or non-response bias occurred in a simulation of two real studies. The UK Biobank study invited everyone, and the people who chose to join were healthier than the people who did not. That is <b>volunteer bias</b> and is discussed in that paper. The smartphone study started with a fair mix of participants, and the people who kept answering had more symptoms than the people who stopped. That is <b>non-response bias</b>.</p>
        <p>Both leave a sample that differs from the population on the outcomes of interest being measured. A bigger sample does not automatically mean that these biases will go away. Strategies such as recruiting through several routes, tracking who is missing, lowering the burden of participation, and compensating people for their time can help recruit a more representative sample, and many real studies discuss how these can improve participation.</p>
      </div>
    </section>
    <div class="actions">
      <button type="button" class="btn secondary" id="c-prev">${icon('i-prev')} Previous</button>
      <button type="button" class="btn secondary" id="c-restart">Restart</button>
      <button type="button" class="btn primary" id="c-menu" aria-disabled="true">Activities Menu</button>
    </div>
  </div>`;
  $('#c-prev').addEventListener('click', () => { state.page--; render(); });
  $('#c-restart').addEventListener('click', () => { state.page = 0; state.r1 = fresh(); state.r2 = fresh(); render(); });
}

/* ---------- Footer / gating ---------- */
function gate(){
  const p = PAGES[state.page];
  if (p.kind==='intro' || p.kind==='congrats' || p.kind==='takeaways') return { ok:true };
  const R = p.round===1 ? state.r1 : state.r2;
  if (p.kind==='predict') return R.predDone ? { ok:true } : { ok:false, msg:'Choose the correct option to continue' };
  if (p.kind==='run') { if (!R.ran) return { ok:false, msg:'Run the study to continue' }; const SC = p.round===1 ? SCEN1 : SCEN2; if (SC.some(x => !R.seen.includes(x.id))) return { ok:false, msg:'View each option to continue' }; if (!R.judge.done) return { ok:false, msg:'Choose the correct option to continue' }; return { ok:true }; }
  if (p.kind==='leak') { if (!R.leakDone) return { ok:false, msg:'Select a box to continue' }; if (!R.why.done) return { ok:false, msg:'Select every reason to continue' }; return { ok:true }; }
  if (p.kind==='fix') { if (!R.best) return { ok:false, msg:'Find the strategy that closes most of the gap to continue' }; if (!R.rank.done) return { ok:false, msg:'Rank the strategies correctly to continue' }; return { ok:true }; }
  return { ok:true };
}
function renderFooter(){
  footerWrap.removeAttribute('inert');
  const p = PAGES[state.page];
  if (p.kind==='congrats') { footerWrap.hidden = true; return; }
  footerWrap.hidden = false;
  const g = gate();
  const last = state.page === PAGES.length - 2;
  footer.innerHTML = `
    ${state.page > 0 ? `<button type="button" class="btn secondary" id="prev">${icon('i-prev')} Previous</button>` : '<span></span>'}
    <span id="live" class="vh" aria-live="polite"></span>
    <span class="gate-msg" id="gate-msg">${g.msg||''}</span><button type="button" class="btn primary" id="next" aria-disabled="${g.ok?'false':'true'}" aria-describedby="gate-msg">${last?'Complete Activity':'Next'} ${icon(g.ok?'i-next':'i-next-blocked')}</button>`;
  const prev = $('#prev'), next = $('#next'), msg = $('#gate-msg');
  if (prev) prev.addEventListener('click', () => { state.page--; render(); });
  const show = () => { if (!gate().ok) msg.classList.add('show'); };
  const hide = () => msg.classList.remove('show');
  next.addEventListener('mouseenter', show); next.addEventListener('focus', show);
  next.addEventListener('mouseleave', hide); next.addEventListener('blur', hide);
  next.addEventListener('click', () => { if (!gate().ok) { show(); return; } state.page++; render(); });
}

render();
})();
</script>
