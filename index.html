function renderPredict(round, bar){
  const R = round===1 ? state.r1 : state.r2;
  const P = round===1 ? PREDICT1 : PREDICT2;
  const title = round===1 ? 'Predict who signs up' : 'Predict who keeps answering';
  const body = round===1
    ? 'UK Biobank mails an invitation to every adult aged 40 to 69 near an assessment center. Choose who you expect to sign up, then run the study and watch.'
    : 'Everyone enrolled in the smartphone study is prompted to complete a symptom check-in each week for six weeks. Choose who you expect to still be answering by week 6, then run it and watch.';
  const pre = round===2 ? `<section class="tone info precontext"><h3>Next Study to Assess</h3><p>Round 2 leaves UK Biobank behind. This is a <b>different study</b> with a different question: a remote smartphone study, where everyone has already enrolled and the question is who keeps answering. Read the study details below before you predict.</p></section>` : '';
  main.innerHTML = `<div class="col">${bar}${pre}
    <section class="card icard"><h2>${title}</h2><p>${body}</p><p class="claim"><b>Claim under test:</b> ${round===1?CLAIM1:CLAIM2}</p></section>
    <details class="study" open><summary>Study details</summary><div class="body">${round===1?STUDY1:STUDY2}</div></details>
    ${simPanelsHTML(round, round===1?'Run the study':'Run the six weeks', `<form id="predict-form"><fieldset class="optgroup"><legend>${P.question}</legend></fieldset></form>`, { meterHidden:!R.predDone })}
  </div>`;
  const SCEN = round===1 ? SCEN1 : SCEN2;
  const explain = (o, { sel, ko }) => ko ? o.why : (sel && R.predDone ? P.feedback + (R.ran ? '' : ' Now run the study and watch.') : '');
  const cfg = round===1 ? METER1 : METER2;
  setMeter(cfg, null);
  wireMeter(cfg, round); wireLegend();
  const runBtn = $('#run-btn');
  const canRun = () => R.predDone;
  const form = $('#predict-form');
  /* Graded the moment an option is chosen: the card turns green or red and its explanation opens inside it. */
  const redrawOptions = () => { $('fieldset', form).innerHTML = `<legend>${P.question}</legend>` + optionsHTML('pred', P.options, R.pred, R.predDone, true, R.predWrong, explain); };
  const drawFeedback = () => { redrawOptions(); };
  /* Comparison after the run: rerun instantly with each possibility. The gate waits until all have been seen. */
  const sf = $('#scen-form');
  const seen = (id) => { if (!R.seen.includes(id)) R.seen.push(id); };
  /* The selected possibility opens its note inside its own card, so the reading sits next to the choice. */
  const drawScen = () => { const s = SCEN.find(x => x.id === (R.scen || 'base')); const had = sf.contains(document.activeElement);
    $('fieldset', sf).innerHTML = '<legend class="vh">Possibilities</legend>' + optionsHTML('scen', SCEN.map(x=>({ id:x.id, text:x.label, note:x.note })), s.id, false, false, [], o => o.id === s.id ? o.note : '');
    if (had) { const i = $('#scen-'+s.id); if (i) i.focus({ preventScroll:true }); }
    const left = SCEN.length - R.seen.length; $('#seen-count').textContent = left ? `${left} of ${SCEN.length} still to view.` : 'All four viewed.'; };
  const showWhatIf = () => { $('#whatif').hidden = !R.ran; if (R.ran) drawScen(); };
  sf.addEventListener('change', e => { if (e.target.name !== 'scen') return; R.scen = e.target.value; seen(R.scen); const s = SCEN.find(x => x.id === R.scen); drawScen(); runSim(round, s.rates === 'base' ? 'base' : s.rates, { instant:true }); renderFooter(); });
  const setRunEnabled = (on) => runBtn.setAttribute('aria-disabled', on?'false':'true');
  setRunEnabled(canRun());
  $('#sample-sub').textContent = !R.predDone ? 'Choose a prediction first.' : 'Press run to send the study out.';
  drawFeedback(); showWhatIf();
  if (R.ran) { const s = SCEN.find(x => x.id === (R.scen || 'base')); runSim(round, s.rates === 'base' ? 'base' : s.rates, { instant:true }); }
  form.addEventListener('change', e => { if (e.target.name!=='pred' || R.predDone) return;
    const pick = e.target.value, o = P.options.find(x=>x.id===pick);
    if (!o.correct) { R.predWrong.push(pick); R.pred = null; redrawOptions(); return; }
    R.pred = pick; R.predDone = true; redrawOptions();
    $('#meter-wrap').hidden = false; setRunEnabled(true); $('#sample-sub').textContent = 'Press run to send the study out.'; renderFooter(); });
  runBtn.addEventListener('click', () => { if (runBtn.getAttribute('aria-disabled')==='true') return; R.scen = null; if (R.ran) drawScen(); runSim(round, 'base', { onDone(){ R.ran = true; seen('base'); drawFeedback(); showWhatIf(); renderFooter(); } }); });
}

function renderLeak(round, bar){
  const R = round===1 ? state.r1 : state.r2;
  const L = round===1 ? LEAK1 : LEAK2;
  const cfg = round===1 ? METER1 : METER2;
  const res = round===1 ? simR1('base') : simR2('base');
  const est = round===1 ? res.share : res.final.mean;
  const counts = round===1 ? [40, res.enrolled.length, res.enrolled.length, null] : [40, res.weeks[0].ids.length, res.final.ids.length, null];
  const tile = (s, i) => {
    const sel = R.leak === s.id, ko = R.leakWrong.includes(s.id), ok = R.leakDone && s.correct;
    const cls = 'st' + (ok?' correct':'') + (ko?' knocked':'') + (sel && !ok && !ko?' selected':'') + (i===3?' result':'');
    const n = i===3 ? `${cfg.fmt(est)} <small>vs ${cfg.fmt(cfg.truth)} true</small>` : counts[i];
    const mark = ok ? `<svg class="mark" aria-hidden="true"><use href="#i-check"/></svg><span class="vh">correct answer</span>` : ko ? `<svg class="mark" aria-hidden="true"><use href="#i-x"/></svg><span class="vh">previously selected, incorrect</span>` : '';
    const pick = (!R.leakDone && !ko) ? `<span class="pick">Select this stage</span>` : '';
    return `<button type="button" class="${cls}" data-id="${s.id}" aria-pressed="${sel?'true':'false'}" ${(R.leakDone||ko)?'disabled':''}><span class="n">${n}</span><span class="lbl">${s.lbl}</span><span class="note">${s.note}</span>${pick}${mark}</button>`;
  };
  main.innerHTML = `<div class="col">${bar}
    <section class="card icard"><h2>Find where the sample leaked</h2><p>${round===1?'The cohort came out far healthier than the people invited.':'The study\'s average symptom score ran high.'} In the flow chart, select the stage where the people in the sample stopped looking like the people the study is about.</p><p class="claim"><b>Claim under test:</b> ${round===1?CLAIM1:CLAIM2}</p></section>
    <details class="study"><summary>Study details</summary><div class="body">${round===1?STUDY1:STUDY2}</div></details>
    <section class="card leak-card"><h3 id="funnel-label">What the run showed. Where did the leak happen?</h3>
      <div class="funnel" role="group" aria-labelledby="funnel-label" id="funnel">${L.stages.map((s,i)=>tile(s,i)+(i<3?'<span class="arrow" aria-hidden="true">&rarr;</span>':'')).join('')}</div>
      <div id="leak-feedback" style="margin-top:12px"></div></section>
  </div>`;
  const redraw = () => { $('#funnel').innerHTML = L.stages.map((s,i)=>tile(s,i)+(i<3?'<span class="arrow" aria-hidden="true">&rarr;</span>':'')).join(''); wire(); };
  const drawFeedback = () => {
    if (R.leakDone) {
      $('#leak-feedback').innerHTML = `<div class="col" style="padding:0"><div class="alert ok" role="status">${icon('i-check')}<div><b>Correct.</b> ${round===1?'Everyone who signed up was assessed. The sample thinned, and skewed, at the moment people decided whether to join.':'The people who enrolled were a fair mix. The sample thinned, and skewed, as people stopped answering.'}</div></div>
        <section class="takeaway"><h3>${L.takeawayTitle}</h3><p>${L.takeaway}</p></section></div>`;
    } else if (R.leakWrong.length) {
      const last = L.stages.find(s => s.id === R.leakWrong[R.leakWrong.length-1]);
      $('#leak-feedback').innerHTML = `<div class="alert bad" role="status">${icon('i-x')}<div><b>Not quite.</b> ${last.why} Select another stage.</div></div>`;
    } else $('#leak-feedback').innerHTML = '';
  };
  /* Graded on click, like the option cards. */
  function wire(){ $$('#funnel button.st').forEach(b => b.addEventListener('click', () => { if (R.leakDone) return; const s = L.stages.find(x => x.id === b.dataset.id);
    if (!s.correct) { R.leakWrong.push(s.id); R.leak = null; redraw(); drawFeedback(); return; }
    R.leak = s.id; R.leakDone = true; redraw(); drawFeedback(); renderFooter(); })); }
  wire(); drawFeedback();
}

function renderFix(round, bar){
  const R = round===1 ? state.r1 : state.r2;
  const REM = round===1 ? REMEDIES1 : REMEDIES2;
  const cfg = round===1 ? METER1 : METER2;
  main.innerHTML = `<div class="col">${bar}
    <section class="card icard"><h2>Fix it and rerun</h2><p>Choose a recruitment remedy. The flock reruns the ${round===1?'study':'six weeks'} with it and the meter moves. Keep trying until you find the remedy that closes most of the gap.</p><p class="claim"><b>Claim under test:</b> ${round===1?CLAIM1:CLAIM2}</p></section>
    <details class="study"><summary>Study details</summary><div class="body">${round===1?STUDY1:STUDY2}</div></details>
    ${stripHTML(round)}
    <div class="pills" role="group" aria-label="Remedy" id="pills"></div>
    <div class="chiprow"><span class="chip" id="chip" role="status" aria-live="polite"></span></div>
    ${resultCardHTML(round)}
    <div class="fix-fb" id="fix-result"></div>
  </div>`;
  const chip = $('#chip'), pills = $('#pills');
  wireMeter(cfg, round, '#pop .head.in-s'); wireLegend();
  setBasePin(cfg, round===1 ? simR1('base').share : simR2('base').final.mean);
  const drawChip = () => { chip.classList.toggle('done', R.best); chip.innerHTML = (R.best ? icon('i-check') + ' Best remedy found, ' : '') + `${R.tried.length} ${R.tried.length===1?'remedy':'remedies'} tried`; };
  const drawPills = () => { pills.innerHTML = REM.map(r => `<button type="button" class="pill" data-id="${r.id}" aria-pressed="${R.remedy===r.id?'true':'false'}">${r.text}${R.tried.includes(r.id)?`<svg class="${r.best?'ok':'bad'}" aria-hidden="true"><use href="#${r.best?'i-check':'i-x'}"/></svg><span class="vh">${r.best?'best remedy':'tried, not the best'}</span>`:''}</button>`).join(''); };
  const showResult = (rem) => { $('#fix-result').innerHTML = rem ? `<div class="alert ${rem.best?'ok':'bad'}" role="status">${icon(rem.best?'i-check':'i-x')}<div><b>${rem.text}.</b> <span class="sub">${rem.sub}</span><br><span class="phrase ${rem.tone}">${rem.phrase}</span> ${rem.note}<span class="ev"><b>Evidence:</b> ${rem.evidence}</span><span class="verdict">${rem.best?FOUND:AGAIN}</span></div></div>` : ''; };
  const apply = () => { const rem = REM.find(r => r.id === R.remedy); applyToPanel(round, rem ? rem.id : 'base', { markNew:true }); if (rem) { if (!R.tried.includes(rem.id)) R.tried.push(rem.id); if (rem.best) R.best = true; } else $('#sample-sub').textContent = 'Baseline, no remedy. Choose one above.'; drawTried(round, R, REM); drawPills(); showResult(rem); drawChip(); renderFooter(); };
  apply();
  pills.addEventListener('click', e => { const b = e.target.closest('.pill'); if (!b) return; R.remedy = b.dataset.id; apply(); $(`.pill[data-id="${R.remedy}"]`).focus({ preventScroll:true }); });
}

function renderJudge(round, bar){
  const R = round===1 ? state.r1 : state.r2;
  const J = R.judge;
  const q = IMPACT[round-1];
  const cfg = round===1 ? METER1 : METER2;
  main.innerHTML = `<div class="col">${bar}
    <section class="card icard"><h2>Judge the impact on inference</h2><p>Here is what happened when the study ran with no remedy. Decide what this bias does to the conclusions a researcher can draw.</p><p class="claim"><b>Claim under test:</b> ${round===1?CLAIM1:CLAIM2}</p></section>
    <details class="study"><summary>Study details</summary><div class="body">${round===1?STUDY1:STUDY2}</div></details>
    ${stripHTML(round)}
    ${resultCardHTML(round, { chart:true })}
    <form id="judge-form"><fieldset class="optgroup"><legend>${q.question}</legend></fieldset></form>
    <div id="judge-takeaway"></div>
  </div>`;
  wireMeter(cfg, round, '#pop .head.in-s'); wireLegend();
  const jf = $('#judge-form');
  applyToPanel(round, 'base');
  const explain = (o, { sel, ko }) => ko ? o.why : (sel && J.done ? q.feedback : '');
  const redraw = () => { $('fieldset', jf).innerHTML = `<legend>${q.question}</legend>` + optionsHTML('judge', q.options, J.pick, J.done, true, J.wrong, explain); };
  const drawFeedback = () => {
    redraw(); $('#judge-takeaway').innerHTML = '';
    if (J.done) { $('#judge-takeaway').innerHTML = `<section class="takeaway"><h3>What this bias does to inference</h3><p>${round===1?'An estimate of how common something is, read straight off a volunteer sample, is wrong in the direction the volunteers lean, and a larger sample repeats the error with more precision. Comparisons between groups inside the sample can survive, but only when what drove people to volunteer is unrelated to both the exposure and the outcome being compared.':'A trend built from a shrinking, self-selected sample describes who is still answering, not how the population is changing. Before reading a change over time, check whether the people behind each time point are the same people.'}</p></section>`; }
  };
  drawFeedback();
  jf.addEventListener('change', e => { if (e.target.name!=='judge' || J.done) return; const pick = e.target.value, o = q.options.find(x => x.id === pick);
    if (!o.correct) { J.wrong.push(pick); J.pick = null; drawFeedback(); return; }
    J.pick = pick; J.done = true; drawFeedback(); renderFooter(); });
}

/* Takeaways page, after the vtr-sap-03 payoff pattern: instruction card, a panel of recap cards built from the actual runs, a side-by-side comparison, then a TakeawayPanel with the pointing raven. */
function renderTakeaways(bar){
  const b1 = simR1('base'), f1 = simR1('outreach'), b2 = simR2('base'), f2 = simR2('shorten');
  const tile = (n, lbl, note, cls='') => `<div class="st ${cls}"><span class="n">${n}</span><span class="lbl">${lbl}</span><span class="note">${note}</span></div>`;
  const arrow = '<span class="arrow" aria-hidden="true">&rarr;</span>';
  const bars = (cfg, rows) => { const pct = v => ((v - cfg.min) / (cfg.max - cfg.min)) * 100; return `<div class="tried">${rows.map(r => `<div class="trow ${r.cur?'cur':''}"><span class="tl">${r.label}</span><span class="tb" aria-hidden="true"><i style="width:${pct(r.est)}%"></i><em style="left:${pct(cfg.truth)}%"></em></span><span class="tv">${cfg.fmt(r.est)}</span></div>`).join('')}<p class="cap"><i></i>True value ${cfg.fmt(cfg.truth)}</p></div>`; };
  main.innerHTML = `<div class="col">${bar}
    <section class="card icard"><h2>Takeaways</h2><p>Two real studies, two different leaks. Here is what each run showed, side by side, and what to carry into the next study you read or design.</p></section>
    <section class="card recap-wrap"><h3>Where each study leaked</h3>
      <div class="recaps">
        <article class="recap"><div class="band"></div><h4>Round 1: UK Biobank</h4><p class="bias">Volunteer bias, at the sign-up stage</p>
          <div class="funnel">${tile(40,'Invited','everyone got a letter')}${arrow}${tile(b1.enrolled.length,'Signed up','the healthier ones came','leak')}${arrow}${tile(`${METER1.fmt(b1.share)} <small>vs ${METER1.fmt(R1_TRUTH)}</small>`,'Estimate','share in poorer health','result')}</div>
          ${bars(METER1, [{ label:'No remedy', est:b1.share }, { label:'Several routes', est:f1.share, cur:true }])}
          <p><b>Best fix:</b> use several recruitment routes. Different routes reach different people, so the cohort starts to look like the invitation list.</p>
        </article>
        <article class="recap"><div class="band"></div><h4>Round 2: Smartphone study</h4><p class="bias">Non-response bias, at the follow-up stage</p>
          <div class="funnel">${tile(40,'Enrolled','a fair mix')}${arrow}${tile(b2.final.ids.length,'Still answering in week 6','the symptomatic ones stayed','leak')}${arrow}${tile(`${METER2.fmt(b2.final.mean)} <small>vs ${METER2.fmt(R2_TRUTH)}</small>`,'Estimate','average symptom score','result')}</div>
          ${bars(METER2, [{ label:'No remedy', est:b2.final.mean }, { label:'Two questions', est:f2.final.mean, cur:true }])}
          <p><b>Best fix:</b> cut the check-in to two questions. Lower burden keeps the people with little to report answering.</p>
        </article>
      </div></section>
    <section class="card"><h3>How to tell them apart</h3>
      <div class="cmp-wrap"><table class="cmp"><thead><tr><th scope="col"></th><th scope="col">Volunteer bias</th><th scope="col">Non-response bias</th></tr></thead><tbody>
        <tr><th scope="row">Where it leaks</th><td>Between being invited and taking part</td><td>Between enrolling and answering</td></tr>
        <tr><th scope="row">Who is missing</th><td>People who never opt in. Here, the less healthy.</td><td>People who stop responding. Here, the least symptomatic.</td></tr>
        <tr><th scope="row">What it does to the estimate</th><td>Prevalence read off the cohort runs low: ${METER1.fmt(b1.share)} against a true ${METER1.fmt(R1_TRUTH)}.</td><td>The average drifts toward the people who keep answering: ${METER2.fmt(b2.final.mean)} against a true ${METER2.fmt(R2_TRUTH)}.</td></tr>
        <tr><th scope="row">How to spot it</th><td>Compare participants with the invitation list.</td><td>Compare each wave of responders with everyone enrolled.</td></tr>
        <tr><th scope="row">What moves it</th><td>Several recruitment routes, tracking who is missing, compensation used with care.</td><td>Lower burden, reminders, compensation per check-in.</td></tr>
        <tr><th scope="row">What does not</th><td>More invitations.</td><td>More participants, or prompting a random subset.</td></tr>
      </tbody></table></div></section>
    <section class="tk" aria-labelledby="tk-h"><h3 class="band" id="tk-h">Takeaway: A bigger sample does not fix a skewed one.</h3>
      <div class="body"><svg class="raven" aria-hidden="true"><use href="#raven-point-left"/></svg>
        <p>Both leaks leave a sample that differs from the population on the very thing being measured, and more of the same sample only repeats the error with more precision. Half a million UK Biobank volunteers were still about half as likely to die as the people they stood in for.</p>
        <p>Before trusting an estimate, ask two questions at two stages: who chose to take part, and who kept answering. Compare each group with the people the study is about, and fix the stage that leaked instead of enlarging the study.</p>
      </div></section>
  </div>`;
}

function renderCongrats(){
  main.innerHTML = `<div class="col congrats">
    <div class="ravens">
      <svg role="img" aria-label="A celebrating raven"><use href="#face-celebratory"/></svg>
      <svg role="img" aria-label="A raven with a party blower"><use href="#face-party-blower"/></svg>
      <svg role="img" aria-label="A raven with stars in its eyes"><use href="#face-stars"/></svg>
    </div>
    <section class="congrats-card"><div class="band"></div>
      <h2>Congratulations, you've completed the activity!</h2>
      <div class="msg">
        <p>You caught both leaks. UK Biobank invited everyone, and the people who chose to join were healthier than the people who did not. That is <b>volunteer bias</b>. The smartphone study started with a fair mix, and the people who kept answering had more symptoms than the people who stopped. That is <b>non-response bias</b>.</p>
        <p>Both leave a sample that differs from the population on the very thing being measured. A bigger sample does not fix it. Recruiting through several routes, tracking who is missing, lowering the burden, and compensating people for their time are what move the estimate, and many real studies spring both leaks at once.</p>
      </div>
    </section>
    <div class="actions">
      <button type="button" class="btn secondary" id="c-prev">${icon('i-prev')} Previous</button>
      <button type="button" class="btn secondary" id="c-restart">Restart</button>
      <button type="button" class="btn primary" id="c-menu" aria-disabled="true">Activities Menu</button>
    </div>
  </div>`;
  $('#c-prev').addEventListener('click', () => { state.page--; render(); });
  $('#c-restart').addEventListener('click', () => { state.page = 0; state.r1 = fresh(); state.r2 = fresh(); render(); });
}

/* ---------- Footer / gating ---------- */
function gate(){
  const p = PAGES[state.page];
  if (p.kind==='intro' || p.kind==='congrats' || p.kind==='takeaways') return { ok:true };
  const R = p.round===1 ? state.r1 : state.r2;
  if (p.kind==='judge') return R.judge.done ? { ok:true } : { ok:false, msg:'Judge the impact on inference to continue' };
  if (p.kind==='predict') { if (!R.predDone) return { ok:false, msg:'Choose the correct prediction to continue' }; if (!R.ran) return { ok:false, msg:'Run the study to continue' }; const SC = p.round===1 ? SCEN1 : SCEN2; if (SC.some(x => !R.seen.includes(x.id))) return { ok:false, msg:'View each possibility to continue' }; return { ok:true }; }
  if (p.kind==='leak') return R.leakDone ? { ok:true } : { ok:false, msg:'Find where the leak happened to continue' };
  if (p.kind==='fix') return R.best ? { ok:true } : { ok:false, msg:'Find the remedy that closes most of the gap to continue' };
  return { ok:true };
}
function renderFooter(){
  const p = PAGES[state.page];
  if (p.kind==='congrats') { footerWrap.hidden = true; return; }
  footerWrap.hidden = false;
  const g = gate();
  const last = state.page === PAGES.length - 2;
  footer.innerHTML = `
    ${state.page > 0 ? `<button type="button" class="btn secondary" id="prev">${icon('i-prev')} Previous</button>` : '<span></span>'}
    <span id="live" class="vh" aria-live="polite"></span>
    <span class="gate-msg" id="gate-msg">${g.msg||''}</span><button type="button" class="btn primary" id="next" aria-disabled="${g.ok?'false':'true'}" aria-describedby="gate-msg">${last?'Complete Activity':'Next'} ${icon(g.ok?'i-next':'i-next-blocked')}</button>`;
  const prev = $('#prev'), next = $('#next'), msg = $('#gate-msg');
  if (prev) prev.addEventListener('click', () => { state.page--; render(); });
  const show = () => { if (!gate().ok) msg.classList.add('show'); };
  const hide = () => msg.classList.remove('show');
  next.addEventListener('mouseenter', show); next.addEventListener('focus', show);
  next.addEventListener('mouseleave', hide); next.addEventListener('blur', hide);
  next.addEventListener('click', () => { if (!gate().ok) { show(); return; } state.page++; render(); });
}

render();
})();
</script>
</body>
</html>
